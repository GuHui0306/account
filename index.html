<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的記帳</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="記帳">
<meta name="theme-color" content="#f5efe6">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="icon.png?v=2">
<style>
:root{--bg:#1c1c1e;--card:#2c2c2e;--card2:#252527;--text:#f2f2f7;--muted:#98989f;--up:#ff6b6b;--down:#4cd08a;--line:#3a3a3c;--acc:#5b9bf3}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{margin:0;color:var(--text);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
/* iOS 27：整頁不捲動，只捲內層，狀態列下方用實心底色蓋住，避免頂端模糊 */
#sbar{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--bg);z-index:8}
#app{position:fixed;top:env(safe-area-inset-top);left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding-top:28px;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
#login,#loading{position:relative;top:env(safe-area-inset-top)}
h2{font-size:15px;color:var(--muted);font-weight:500;margin:0 0 6px}
.big{font-size:34px;font-weight:700;margin:2px 0 6px;letter-spacing:-.5px}
.card{background:var(--card);border-radius:14px;margin:12px;padding:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .l{min-width:0}.row .r{text-align:right;white-space:nowrap}
.name{font-size:15px}.muted{color:var(--muted);font-size:12px}
.up{color:var(--up)}.down{color:var(--down)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.grid3 .v{font-size:16px;font-weight:600;margin-top:4px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:10px 0 8px;background:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#111113;transform:translateZ(0);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:12px 0 10px;font-size:12px;font-family:inherit}
nav button.on{color:var(--acc)}
.page{display:none}.page.on{display:block}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.calhead button{background:none;border:0;color:var(--text);font-size:20px;padding:4px 12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal div{border-radius:8px;min-height:58px;padding:4px;font-size:10px;background:var(--card2);line-height:1.35;overflow:hidden}
.cal .h{min-height:auto;background:none;text-align:center;color:var(--muted);font-size:12px}
.cal .e{background:none}
.cal .pos{background:rgba(255,107,107,.18)}.cal .neg{background:rgba(76,208,138,.15)}
.cal b{font-size:12px;display:block;margin-bottom:2px}
select,input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;margin:6px 0 10px;font-family:inherit}
label{font-size:13px;color:var(--muted)}
.btn{width:100%;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:14px;font-size:16px;font-family:inherit}
.btn:disabled{opacity:.5}
.seg{display:flex;gap:8px;margin:6px 0 10px}
.seg button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--text);font-size:15px;font-family:inherit}
.seg button.on{background:var(--acc);border-color:var(--acc)}
#toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#3a3a3c;padding:10px 16px;border-radius:10px;display:none;z-index:9;font-size:14px}
#loading{text-align:center;color:var(--muted);padding:60px 0}
.refresh{float:right;background:none;border:0;color:var(--acc);font-size:13px;font-family:inherit}
.chartbox{position:relative;height:220px}
.ysel:disabled{opacity:.35}
.sw{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:2px;flex:0 0 auto}
.sw button{background:none;border:0;color:var(--muted);font-size:15px;font-weight:700;width:34px;height:30px;border-radius:13px;font-family:inherit}
.sw button.on{background:var(--acc);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.chips button{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:6px 12px;font-size:14px;font-family:inherit}
.chips button.on{background:var(--acc);border-color:var(--acc)}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--line);color:var(--text);margin-right:6px;vertical-align:1px}

/* ---------- 明細（記錄 / 報表） ---------- */
.lhead{display:flex;justify-content:space-between;align-items:center;padding:0 12px;gap:10px}
.ympick{display:flex;gap:8px;justify-content:center}
.ysel{appearance:none;-webkit-appearance:none;width:auto;margin:0;background:var(--card) url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2710%27 height=%276%27%3E%3Cpath d=%27M1 1l4 4 4-4%27 stroke=%27%238a6a4a%27 stroke-width=%271.6%27 fill=%27none%27/%3E%3C/svg%3E") no-repeat right 12px center;border:1px solid var(--line);border-radius:18px;color:var(--text);font-size:16px;font-weight:600;padding:7px 30px 7px 14px;font-family:inherit}
.card .ympick{margin-bottom:10px}
.accwrap{position:relative;min-width:0;color:var(--acc);font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:6px 0}
.accsel{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;padding:0;font-size:16px}
.mnav{display:flex;align-items:center;gap:4px;font-size:18px;font-weight:600;white-space:nowrap}
.mnav button{background:none;border:0;color:var(--acc);font-size:22px;padding:2px 10px;font-family:inherit}
.lspacer{}
.lcal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.lcal .wh{text-align:center;color:var(--muted);font-size:12px;padding:2px 0 4px}
.lcal .dc{background:var(--card2);border-radius:8px;min-height:54px;padding:3px 2px;text-align:center;font-size:9.5px;line-height:1.3;overflow:hidden;cursor:pointer}
.lcal .dc b{display:block;font-size:14px;font-weight:600;color:#c9c9f5;margin-bottom:1px}
.lcal .dc.other{opacity:.35}
.lcal .dc.today{background:#f5c542}.lcal .dc.today b{color:#1c1c1e}
.lcal .dc.today .gi{color:#b3261e}.lcal .dc.today .ro{color:#0b6b36}
.gi{color:var(--up)}.ro{color:var(--down)}   /* 明細頁：收入紅、支出綠 */
.fx{font-size:9px;opacity:.85}
.tgrid{display:grid;grid-template-columns:62px 1fr 1fr 1fr;column-gap:10px;row-gap:4px;align-items:baseline;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.tgrid>div{text-align:right;white-space:nowrap}
.tgrid .cl{text-align:left;color:var(--muted);font-size:13px}
.tgrid .hd{color:var(--muted);font-size:12px}
.tgrid .big{font-size:18px;font-weight:700;letter-spacing:-.3px;margin:0}
.tgrid .sm{font-size:14px}
.ycal{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.ycal .mc{background:var(--card2);border-radius:8px;padding:5px 2px 6px;cursor:pointer;min-height:64px;text-align:center;overflow:hidden}
.ycal .mc b{display:block;font-size:13px;margin-bottom:2px;color:#c9c9f5}
.ycal .mc.now{outline:2px solid #f5c542;outline-offset:-2px}
.ycal .mc div{font-size:9.5px;line-height:1.35;font-variant-numeric:tabular-nums}
.ycal .mc .fx{font-size:8.5px}
.crow .fxl{font-size:11px;color:var(--muted);margin-top:2px}
.ltot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.ltot .muted{font-size:12px}.ltot .v{font-size:19px;font-weight:700;margin-top:2px;letter-spacing:-.3px}
.ltot>div:nth-child(2){text-align:center}.ltot>div:last-child{text-align:right}
.dgrp{background:var(--card);border-radius:14px;margin:10px 12px;padding:4px 14px;scroll-margin-top:10px}
.dgh{display:flex;justify-content:space-between;font-size:13px;padding:10px 0 8px;border-bottom:1px solid var(--line)}
.dgh .s{font-weight:600}
.trow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.ic{flex:0 0 40px;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}
.trow .l{flex:1;min-width:0}.trow .l .c{font-size:15px;font-weight:600}
.trow .l .n{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .r{text-align:right;white-space:nowrap}.trow .r .a{font-size:16px;font-weight:600}
.trow .r .m{font-size:11px;color:var(--muted);margin-top:2px}
.a.x{color:var(--muted)}
#vToggle{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom));display:none;background:rgba(44,44,46,.92);border:1px solid var(--line);border-radius:20px;padding:3px;z-index:6;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
#vToggle button{background:none;border:0;color:var(--muted);font-size:14px;padding:7px 20px;border-radius:17px;font-family:inherit}
#vToggle button.on{background:#48484a;color:var(--text)}
#p3{padding-bottom:56px}
.kseg{display:grid;grid-template-columns:62px 1fr 1fr;column-gap:12px;row-gap:4px;align-items:baseline;margin:12px 4px 2px;font-variant-numeric:tabular-nums}
.kseg>div{text-align:right;white-space:nowrap;font-size:14px}
.kseg .cl{text-align:left;color:var(--muted);font-size:13px}
.kseg .main{font-size:17px;font-weight:700}
.kseg button{justify-self:end;background:none;border:0;border-radius:10px;padding:2px 12px;font-size:13px;font-family:inherit;color:var(--text)}
.kseg button.on{background:var(--down);color:#08361d}
.kseg button.on.in{background:var(--up);color:#fff}
.donut{display:flex;justify-content:center;margin-top:6px}
.crow{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer}
.crow .l{flex:1;min-width:0}
.crow .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.crow .nm{font-size:15px;font-weight:600}
.crow .pc{font-size:11px;color:var(--muted);background:var(--card2);border-radius:8px;padding:1px 6px;margin-left:6px;font-weight:400}
.crow .amt{font-size:15px;font-weight:600}
.crow .bt{display:flex;align-items:center;gap:10px;margin-top:6px}
.crow .bar2{flex:1;height:5px;background:var(--card2);border-radius:3px;overflow:hidden}
.crow .bar2 i{display:block;height:100%;border-radius:3px}
.crow .cnt{font-size:11px;color:var(--muted);white-space:nowrap}
.crow .chev{color:var(--muted);font-size:20px;padding-left:2px}
#sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;overscroll-behavior:contain;display:none;padding-top:env(safe-area-inset-top);padding-bottom:calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.shead{display:flex;align-items:center;justify-content:space-between;padding:10px 12px}
.shead button{background:none;border:0;color:var(--text);font-size:22px;padding:4px 10px;font-family:inherit}
.shead .mnav{font-size:16px}
.stot{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 4px}
.stot .t{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700}
.stot .v{font-size:17px;font-weight:700}

.cal div[data-d]{cursor:pointer}
#daySheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:none;align-items:flex-end;overscroll-behavior:contain;transition:background .2s}
.dpanel{background:var(--bg);width:100%;max-height:90vh;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;will-change:transform;border-radius:22px 22px 0 0;padding:6px 16px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:#48484a;margin:4px auto 6px}
.dtop{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:14px}
.dtop b{font-size:17px}
.dtop button{justify-self:end;background:#3a3a3c;color:#f5c542;border:0;border-radius:18px;padding:9px 16px;font-size:15px;font-weight:600;font-family:inherit}
.dhead .muted{font-size:13px}.dhead .bigp{font-size:28px;font-weight:700;margin:4px 0 14px;letter-spacing:-.3px}
.dhead .bigp span{margin-right:10px}
.dbox{background:var(--card);border-radius:14px;padding:2px 14px;margin-bottom:20px}
.drow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:0}
.drow .di{width:22px;text-align:center;font-size:16px}
.drow .dl{flex:1}.drow .dl .t{font-size:15px}.drow .dl .s{font-size:11px;color:var(--muted);margin-top:1px}
.drow .dv{font-size:16px;font-weight:600}
.drow.tot .t{font-weight:700}
.comp{display:grid;grid-template-columns:1fr 110px 92px;align-items:center;gap:8px;padding:9px 0}
.comp .cd{font-size:15px;font-weight:600}.comp .cm{font-size:11px;color:var(--muted)}.comp .cfx{font-size:11px;color:#f0a35e}
.comp .cb{position:relative;height:12px}
.comp .cb:before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--line)}
.comp .cb i{position:absolute;top:0;height:12px;border-radius:3px}
.comp .ca{text-align:right;font-size:15px;font-weight:600}
.hold{padding:16px 0 14px;border-bottom:1px solid var(--line)}
.hold:last-child{border-bottom:0;padding-bottom:4px}
.hh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.hh .nm{font-size:16px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hh .cd{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.hh .px{font-size:13px;font-weight:500;margin-left:8px;padding:1px 7px;border-radius:6px;background:var(--card2);font-variant-numeric:tabular-nums}
.hh .mv{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.hs{display:flex;justify-content:space-between;align-items:center;margin-top:3px;font-size:13px;font-variant-numeric:tabular-nums}
.hs .tg{font-size:11px;color:var(--muted);background:var(--card2);border-radius:6px;padding:1px 7px}
.hg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;background:var(--card2);border-radius:10px;padding:8px 10px}
.hg .k{font-size:11px;color:var(--muted)}
.hg .v{font-size:13px;margin-top:1px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- 淨資產趨勢 ---------- */
.nethead{display:flex;justify-content:space-between;align-items:center;gap:10px}
#spark{cursor:pointer;flex:0 0 auto;padding:2px 0 0 4px}
#trend{position:fixed;inset:0;background:var(--bg);z-index:22;overflow-y:auto;overscroll-behavior:contain;display:none;padding-top:env(safe-area-inset-top);padding-bottom:calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
#trend .shead b{font-size:17px}
.trnav{display:flex;align-items:center;justify-content:center;gap:4px;margin:2px 0 10px}
.trnav>button{background:none;border:0;color:var(--acc);font-size:24px;padding:2px 12px;font-family:inherit}
.trrow{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.trrow:last-child{border-bottom:0}
.trrow .tt{font-size:16px;font-weight:600}
.trrow .tv{text-align:right;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.trrow .tc{font-size:13px;font-weight:500;margin-top:2px}
/* ================= IG 風格 ================= */
:root{--bg:#f5efe6;--card:#fbf7f1;--card2:#efe7db;--text:#3b3128;--muted:#9a8c7c;--line:#e6dccd;--acc:#8a6a4a;--up:#c0564e;--down:#5f8a5f;
  --ig:linear-gradient(45deg,#e8d5b9 0%,#c9a882 50%,#9c7b5c 100%)}
html,body{background:var(--bg)}
body{color:var(--text)}
#sbar{background:var(--bg)}
#app{padding-top:0}
.card{border-radius:0;margin:0;padding:14px 16px;border-bottom:1px solid var(--line)}
h2{color:var(--text);font-size:15px;font-weight:700;margin-bottom:10px}
.big{letter-spacing:-1px}
.muted{color:var(--muted)}
/* 頂部列 */
/* 標題位置固定：狀態列下方再往下 30px（使用者確認過的位置）。不要加 backdrop-filter／半透明，iPhone 上字會糊 */
.igtop{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:30px 12px 10px 16px}
.igtop .logo{font-size:23px;font-weight:800;letter-spacing:.5px;color:#5a4636}
.igtop .ib{background:none;border:0;padding:6px;margin-left:6px;color:var(--text)}
.igtop .ib svg,.ph .ib svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
/* 限時動態：帳戶 */
.st-next{font-size:12px;color:var(--muted);margin-top:1px}
.stories{display:flex;gap:14px;overflow-x:auto;padding:6px 14px 14px;border-bottom:1px solid var(--line);scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.st{flex:0 0 auto;width:68px;text-align:center;background:none;border:0;padding:0;font-family:inherit;color:var(--text)}
.st .ring{width:66px;height:66px;border-radius:50%;padding:2.5px;background:var(--ig);margin:0 auto}
.st.debt .ring{background:#d8cfc2}
.st .ring div{width:100%;height:100%;border-radius:50%;border:3px solid var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff}
.st .nm{font-size:11.5px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .bl{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.st.debt .bl{color:var(--down)}
/* 貼文 */
.post{border-bottom:1px solid var(--line);padding-bottom:12px}
.ph{display:flex;align-items:center;gap:10px;padding:10px 12px 8px 14px}
.ph .av{width:34px;height:34px;border-radius:50%;padding:2px;background:var(--ig);flex:0 0 34px}
.ph .av div{width:100%;height:100%;border-radius:50%;border:2px solid var(--bg);background:#5a4636;color:#f5efe6;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.ph .who{flex:1;min-width:0}.ph .who b{font-size:14px;display:block}.ph .who span{font-size:12px;color:var(--muted)}
.ph .ib{background:none;border:0;padding:4px;color:var(--text)}
.hero{margin:0 14px;border-radius:22px;padding:20px 20px 14px;color:#fbf7f1;background:linear-gradient(150deg,#8a6c51 0%,#6e5440 55%,#5a4636 100%);box-shadow:0 10px 24px rgba(90,70,54,.18);position:relative;overflow:hidden;cursor:pointer}
.hero .lb{font-size:13px;opacity:.85}
.hero .big{color:#fbf7f1;font-size:36px;margin:2px 0 4px}
.hero #spark{height:92px;margin:6px -4px 0}
.hero #spark .muted{color:rgba(251,247,241,.75)!important}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;padding:14px 8px 4px}
.pstats .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.pstats .k{font-size:12.5px;color:var(--muted);margin-top:1px}
.pstats .down{color:var(--text)}
.cap{padding:2px 16px 0;font-size:13.5px;line-height:1.5}
.cap b{font-weight:700;margin-right:6px}
.post .bar{margin:10px 16px 8px;height:6px;border-radius:3px;background:var(--line)}
.post .legend{padding:0 16px}
.acchd{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 4px}
.acchd b{font-size:16px}
#accList{padding:0 16px}
#accList .row{border-bottom:0;padding:8px 0}
.aav{width:44px;height:44px;border-radius:50%;flex:0 0 44px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px}
.row .l{display:flex;align-items:center;gap:12px}
.row .name{font-weight:600;font-size:14.5px}
.row .r{font-weight:600;font-variant-numeric:tabular-nums}
/* 底部列 */
nav{background:var(--card);border-top:1px solid var(--line)}
nav button{color:#9a8c7c;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px}
nav button svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button span{display:none}
nav button.on{color:#5a4636}
nav button.on svg{stroke-width:2.6}
nav button:nth-child(4){order:2}
nav button:nth-child(2){order:3}nav button:nth-child(3){order:4}
/* 表單、按鈕、選單 */
select,input{background:var(--card);border:1px solid var(--line);color:var(--text)}
.btn{background:#5a4636;color:#fbf7f1;border-radius:10px;font-weight:600}
.seg button{border-color:var(--line);color:var(--text)}
.seg button.on{background:#5a4636;border-color:#5a4636;color:#fbf7f1}
.chips button{background:var(--card2);border:0;color:var(--text);font-weight:500}
.chips button.on{background:#5a4636;color:#fbf7f1}
.ysel{background-color:var(--card);border-color:var(--line);color:var(--text)}
.refresh{color:var(--acc)}
#toast{background:#5a4636;color:#fbf7f1;border-radius:12px}
#vToggle{background:rgba(251,247,241,.95);border-color:var(--line);box-shadow:0 4px 18px rgba(0,0,0,.08)}
#vToggle button.on{background:#5a4636;color:#fbf7f1}
.dgrp{background:transparent;border-radius:0;margin:0;border-bottom:1px solid var(--line);padding:4px 16px}
.dgh{border-bottom:0;color:var(--muted)}
.trow{border-bottom:0}
.ic{background:var(--card2)!important}
.lcal .dc,.ycal .mc,.cal div{background:var(--card)}
.cal .h,.cal .e{background:none}
.lcal .dc b,.ycal .mc b{color:var(--text)}
.lcal .dc.today{background:#5a4636}.lcal .dc.today b{color:#fbf7f1}.lcal .dc.today .gi{color:#f0b0a8}.lcal .dc.today .ro{color:#b9d9b0}
.ycal .mc.now{outline-color:#8a6a4a}
.cal .pos{background:rgba(192,86,78,.13)}.cal .neg{background:rgba(95,138,95,.13)}
.hold,.row,.drow,.trrow{border-color:var(--line)}
.hg,.hh .px,.hs .tg,.crow .pc,.crow .bar2{background:var(--card2)}
.kseg button.on{background:var(--down);color:#fff}
#sheet,#trend{background:var(--bg)}
#daySheet{background:rgba(0,0,0,.35)}
.dpanel{background:var(--bg)}
.grab{background:#d8cfc2}
.dtop button{background:var(--card2);color:var(--text)}
/* 編輯分類／備註 */
.trow{cursor:pointer}.trow:active{opacity:.6}
#editSheet{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none;align-items:flex-end}
.epanel{background:var(--bg);width:100%;max-height:90vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:6px 16px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease-out;overscroll-behavior:contain;touch-action:pan-y;will-change:transform;-webkit-overflow-scrolling:touch}
.ehead{display:flex;align-items:center;gap:12px;padding:6px 0 14px;border-bottom:1px solid var(--line);margin-bottom:12px}
.ehead .amt{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.ehead .meta{font-size:13px;color:var(--muted);margin-top:2px}
.ebtns{display:flex;gap:10px;margin-top:6px}
.ebtns button{flex:1;border:0;border-radius:10px;padding:14px;font-size:16px;font-family:inherit}
.ebtns .cancel{background:var(--card2);color:var(--text)}
.ebtns .save{background:var(--acc);color:#fff}
.ebtns button:disabled{opacity:.5}
.e2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.e2>div{min-width:0}
.e2 input,.e2 select{margin:6px 0 10px;min-width:0;width:100%;max-width:100%;-webkit-appearance:none;appearance:none;min-height:46px;text-align:left}
.etog{display:flex;align-items:center;justify-content:space-between;padding:10px 0 12px;font-size:15px}
.etog input{width:22px;height:22px;margin:0;accent-color:var(--acc)}
.evoid{width:100%;background:none;border:1px solid #d9b7b3;color:#b0534b;border-radius:10px;padding:12px;font-size:15px;margin-top:10px;font-family:inherit}
.evoid.arm{background:#b0534b;color:#fff;border-color:#b0534b}
.tag2{display:inline-block;font-size:10px;padding:0 5px;border-radius:5px;background:var(--line);color:var(--muted);margin-left:5px;vertical-align:2px;font-weight:500}
.ovl{position:fixed;inset:0;background:var(--bg);z-index:23;overflow-y:auto;overscroll-behavior:contain;display:none;padding-top:env(safe-area-inset-top);padding-bottom:calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.ovl .shead b{font-size:17px}
.sbox{flex:1;margin:0 6px!important;padding:10px 12px!important;font-size:16px}
.ibn{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;margin:12px;padding:12px 14px;cursor:pointer}
.ibn b{font-size:15px}.ibn .cnt{background:#c0564e;color:#fff;border-radius:11px;min-width:22px;height:22px;padding:0 7px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.fx-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.fx-row:last-child{border-bottom:0}
.fx-row .l{flex:1;min-width:0}.fx-row .n{font-size:15px}.fx-row .m{font-size:12px;color:var(--muted)}
.fx-row .r{text-align:right;font-variant-numeric:tabular-nums}
.st-ok{color:#5f8a5f;font-size:12px}.st-wait{color:var(--muted);font-size:12px}.st-late{color:#b0534b;font-size:12px}
.cc-row{padding:10px 0;border-bottom:1px solid var(--line)}.cc-row:last-child{border-bottom:0}
.cc-top{display:flex;justify-content:space-between;align-items:baseline}.cc-top b{font-size:15px}
.cc-sub{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.pgtitle{font-size:26px;font-weight:800;color:#3b3128;margin:10px 16px 10px;letter-spacing:.5px}
.pills{display:flex;gap:8px;margin:0 12px 4px;overflow-x:auto}
.pills button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:18px;padding:8px 16px;font-size:14px;font-weight:600;font-family:inherit}
.pills button.on{background:#6f7f6a;border-color:#6f7f6a;color:#fff}
.dvnext{display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px}
.dvnext .when{font-size:24px;font-weight:800}.dvnext .amt{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.dvnext .amt small,.dvbox small{font-size:12px;color:var(--muted);font-weight:500;margin-right:4px}
.dv2{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:0 6px}
.dv2 .card{margin:6px}
.dvbox .v{font-size:20px;font-weight:700;margin-top:8px;font-variant-numeric:tabular-nums}
.dcal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px;text-align:center;margin-top:8px}
.dcal .wh{font-size:12px;color:var(--muted);padding-bottom:4px}
.dcal .d{font-size:14px;padding:6px 0 2px;position:relative;cursor:pointer}
.dcal .d.has{font-weight:800}.dcal .d.today b{display:inline-block;width:28px;height:28px;line-height:26px;border:1.5px solid #6f7f6a;border-radius:50%;margin-top:-4px}
.dcal .d i{display:block;width:6px;height:6px;border-radius:50%;margin:3px auto 0;background:#c4a77d}
.dcal .d i.est{background:none;border:1.5px solid #c4a77d;width:7px;height:7px}
.dcal .d i.none{visibility:hidden}
.dleg{display:flex;gap:8px;margin-top:10px}.dleg span{font-size:12px;background:var(--card2);border-radius:12px;padding:3px 10px;color:var(--muted)}
.dleg i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#c4a77d;margin-right:5px;vertical-align:1px}.dleg i.est{background:none;border:1.5px solid #c4a77d}
.dvrow{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.dvrow:last-child{border-bottom:0}.dvrow .nm{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.dvrow .nm small{color:var(--muted);margin-left:6px}
.dvrow .r{text-align:right}.dvrow .r small{display:block;color:var(--muted);font-size:11px}
.hold{cursor:pointer}.hold:active{opacity:.7}
.skhero{text-align:center;padding-top:6px}.skhero .k{font-size:13px;color:var(--muted)}.skhero .big{font-size:34px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.skg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.skg .k{font-size:12px;color:var(--muted)}.skg .v{font-size:16px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.skseg{display:inline-flex;background:var(--card2);border-radius:10px;padding:3px;margin-bottom:8px}.skseg button{border:0;background:none;padding:5px 12px;border-radius:8px;font-size:13px;color:var(--muted);font-family:inherit}.skseg button.on{background:var(--card);color:var(--text);font-weight:700}
.skinfo{font-size:13px;color:var(--muted);margin-bottom:6px;font-variant-numeric:tabular-nums}.skinfo b{color:var(--text)}.skinfo .av{color:#b98b3e}
.sklg{display:flex;justify-content:center;gap:12px;font-size:12px;color:var(--muted);margin-top:6px}
.hrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}.hrow:last-child{border-bottom:0}
.hrow .ic2{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 auto}
.hrow .l{flex:1;min-width:0}.hrow .t{font-size:15px}.hrow .m{font-size:12px;color:var(--muted)}.hrow .r{text-align:right;font-size:15px}
#ptr{position:fixed;top:calc(env(safe-area-inset-top) + 6px);left:50%;transform:translate(-50%,-60px);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 14px;font-size:13px;color:var(--muted);z-index:9;transition:transform .15s}
.dbox{background:var(--card)}
.lhead{padding-top:10px}
.lhead .ympick{flex:0 1 auto;min-width:0}
.lhead .ysel{padding:7px 26px 7px 12px;background-position:right 10px center}
.lhead .srch{flex:0 0 auto;background:none;border:0;padding:6px 2px 6px 4px;margin:0;color:var(--text)}
.lhead .srch svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;display:block}
#login{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:22vh 20px 0!important;text-align:center}
#login h2{font-size:28px;font-weight:800;justify-content:center;color:#5a4636;margin-bottom:18px}
#login label{display:none}
</style>
</head>
<body>

<div id="login" class="card" style="margin-top:30vh;display:none">
  <h2>我的記帳</h2>
  <label>請輸入密碼</label>
  <input id="pw" type="password" autocomplete="current-password">
  <button class="btn" onclick="login()">登入</button>
</div>

<div id="sbar"></div>
<div id="loading">讀取中…</div>

<div id="app" style="display:none">
  <!-- 總覽 -->
  <section id="p0" class="page on">
    <div class="igtop"><div class="logo">我的記帳</div><div><button class="ib" onclick="load()" aria-label="重新整理"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button><button class="ib" onclick="go(3)" aria-label="記一筆"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg></button></div></div>
    <div class="post">
      <div class="ph"><div class="av"><div>淨</div></div><div class="who"><b>淨資產</b><span id="syncTxt">含股票</span></div><button class="ib" onclick="openTrend()" aria-label="看趨勢"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg></button></div>
      <div class="hero" onclick="openTrend()"><div class="lb">淨資產（含股票）</div><div class="big" id="netTotal">-</div><div id="spark"></div></div>
      <div class="pstats"><div><div class="v" id="sDep">-</div><div class="k">存款</div></div><div><div class="v" id="sStock">-</div><div class="k">股票</div></div><div><div class="v down" id="sDebt">-</div><div class="k">負債</div></div></div>
      <div class="bar" id="allocBar"></div>
      <div class="legend" id="allocLegend"></div>
    </div>
    <div id="ovInbox"></div>
    <div class="card" id="ovFixed" style="display:none"></div>
    <div class="card" id="ovCards" style="display:none"></div>
    <div class="acchd"><b>帳戶</b><span class="muted" id="accCnt"></span></div>
    <div id="accList"></div>
  </section>

  <!-- 股票 -->
  <section id="p1" class="page">
    <div class="pgtitle">股票</div>
    <div class="pills"><button id="skTabV" class="on" onclick="stTab('v')">股票總市值</button><button id="skTabD" onclick="stTab('d')">股票配息</button></div>
    <div id="stDiv" style="display:none"></div>
    <div id="stVal">
    <div class="card">
      <h2>股票總市值</h2>
      <div class="big" id="stTotal">-</div>
      <div id="stPnl"></div>
      <div class="ympick" style="margin:14px 0 4px;align-items:center"><select id="chY" class="ysel" onchange="drawChart()"></select><select id="chM" class="ysel" onchange="drawChart()"></select></div>
      <div class="chartbox" style="margin-top:6px"><canvas id="histChart"></canvas></div>
      <div id="chEmpty" class="muted" style="text-align:center;display:none;margin-top:-120px;height:120px">這段期間沒有資料</div>
    </div>
    <div class="card">
      <div class="ympick"><select id="calY" class="ysel" onchange="pickCal()"></select><select id="calM" class="ysel" onchange="pickCal()"></select></div>
      <div id="calSum" class="muted" style="text-align:center;margin:-2px 0 10px"></div>
      <div class="cal" id="cal"></div>
      <div class="muted" style="margin-top:10px">點日期看當天損益組成・已扣除資金進出</div>
    </div>
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><h2 style="margin:0">持股</h2><select id="stF" class="ysel" onchange="renderStocks()"><option value="">全部</option><option value="台股">台股</option><option value="美股">美股</option></select></div><div id="stSum" class="grid3" style="margin:8px 0 6px;padding-bottom:10px;border-bottom:1px solid var(--line)"></div><div id="stList"></div></div>
    </div>
  </section>

  <!-- 明細 -->
  <section id="p3" class="page">
    <div class="lhead">
      <div class="accwrap"><span id="accLbl">全部帳戶</span> ▾<select id="txAcc" class="accsel" onchange="renderTx()"></select></div>
      <div class="ympick"><select id="txY" class="ysel" onchange="pickTx()"></select><select id="txM" class="ysel" onchange="pickTx()"></select></div><button class="ib srch" onclick="openSearch()" aria-label="搜尋"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
    </div>
    <div id="vRec">
      <div class="card">
        <div class="lcal" id="lcal"></div>
        <div class="ltot" id="ltot"></div>
      </div>
      <div id="dayList"></div>
    </div>
    <div id="vRep" style="display:none">
      <div class="card">
        <h2>類別</h2>
        <div class="donut" id="donut"></div>
        <div class="kseg" id="kseg"></div>
      </div>
      <div class="card"><h2>類別統計</h2><div id="catStat"></div></div>
    </div>
  </section>

  <!-- 記一筆 -->
  <section id="p4" class="page">
    <div class="card">
      <h2>記一筆</h2>
      <label>帳戶</label>
      <select id="fAcc"></select>
      <div class="seg">
        <button id="kOut" class="on" onclick="setKind('支出')">支出</button>
        <button id="kIn" onclick="setKind('收入')">收入</button>
      </div>
      <label>金額</label>
      <input id="fAmt" type="number" inputmode="decimal" placeholder="0">
      <label>分類</label>
      <div class="chips" id="catChips"></div>
      <input id="fCat" list="catList" placeholder="例：餐飲">
      <datalist id="catList"></datalist>
      <label>備註</label>
      <input id="fNote" list="noteList" placeholder="例：午餐 / 麥當勞（可留空）">
      <datalist id="noteList"></datalist>
      <button class="btn" id="fBtn" onclick="addEntry()">記錄</button>
      <div class="muted" style="margin-top:10px">時間自動填現在，結餘從該帳戶最新一筆往下算，類型標「快速」。</div>
    </div>
  </section>
</div>

<nav id="nav" style="display:none">
  <button class="on" onclick="go(0)"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>總覽</span></button>
  <button onclick="go(1)"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg><span>股票</span></button>
  <button onclick="go(2)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg><span>明細</span></button>
  <button onclick="go(3)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg><span>記一筆</span></button>
</nav>

<div id="vToggle"><button id="tRec" class="on" onclick="setView('rec')">記錄</button><button id="tRep" onclick="setView('rep')">報表</button></div>

<div id="sheet">
  <div class="shead">
    <button onclick="closeSheet()">✕</button>
    <div class="mnav"><button onclick="txMove(-1)">‹</button><span id="shTitle"></span><button onclick="txMove(1)">›</button></div>
    <button style="visibility:hidden">✕</button>
  </div>
  <div class="stot" id="shTot"></div>
  <div id="shList"></div>
</div>


<div id="trend">
  <div class="shead"><button onclick="closeTrend()">✕</button><b>趨勢</b><button style="visibility:hidden">✕</button></div>
  <div class="trnav"><button onclick="trMove(-1)">‹</button><div class="ympick"><select id="trY" class="ysel" onchange="pickTrend()"></select><select id="trM" class="ysel" onchange="pickTrend()"></select></div><button onclick="trMove(1)">›</button></div>
  <div class="card">
    <div class="accwrap" style="display:inline-block;margin-bottom:6px"><span id="trLbl">淨資產</span> ▾<select id="trMetric" class="accsel" onchange="pickTrend()"><option value="net">淨資產</option><option value="asset">總資產</option><option value="debt">總負債</option></select></div>
    <div class="chartbox"><canvas id="trChart"></canvas></div>
  </div>
  <div class="card" style="padding-top:4px;padding-bottom:4px"><div id="trList"></div></div>
</div>

<div id="daySheet" onclick="if(event.target===this)closeDay()">
  <div class="dpanel">
    <div class="grab"></div>
    <div class="dtop"><span></span><b id="dTitle"></b><button onclick="closeDay()">完成</button></div>
    <div id="dBody"></div>
  </div>
</div>

<div id="inbox" class="ovl">
  <div class="shead"><button onclick="closeOvl('inbox')">✕</button><b>待確認</b><button style="visibility:hidden">✕</button></div>
  <div class="muted" style="padding:0 16px 4px">未分類、或推播自動記的。點一筆確認分類，存檔後就會離開這裡。</div>
  <div style="padding:6px 12px 0"><button class="btn" id="ibAll" onclick="confirmAll()">已有分類的推播全部確認</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
var CHMODE = 'v', TK = null, D = null, chart = null, calM = null, kind = '支出';
var COLORS = ['#a8876a', '#8c9a7b', '#c4a77d', '#a78bfa', '#ff6b6b', '#f5c542', '#7dd3fc', '#98989f'];

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function num(n) { return typeof n === 'number' && isFinite(n); }
function fmt(n, dp) { return num(n) ? n.toLocaleString('zh-TW', { maximumFractionDigits: dp || 0, minimumFractionDigits: dp || 0 }) : '-'; }
function sgn(n, dp) { return num(n) ? (n > 0 ? '+' : '') + fmt(n, dp) : '-'; }
function pct(n) { return num(n) ? (n > 0 ? '+' : '') + (n * 100).toFixed(2) + '%' : ''; }
function cls(n) { return num(n) && n > 0 ? 'up' : (num(n) && n < 0 ? 'down' : ''); }
function toast(t) { var e = $('toast'); e.textContent = t; e.style.display = 'block'; setTimeout(function () { e.style.display = 'none'; }, 2500); }
function store(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function stored(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

var API = 'https://script.google.com/macros/s/AKfycbzg_pErTf2VVKW_DLk1n9AeiusZyk6DtfAWVkuUFonXD4At1AEw-NJ0_9GCi1_cDBtkgQ/exec';
function api(params, post) {
  var q = new URLSearchParams(params);
  var req = post ? fetch(API, { method: 'POST', body: q }) : fetch(API + '?' + q.toString());
  return req.then(function (r) { return r.text(); }).then(function (t) {
    var o; try { o = JSON.parse(t); } catch (e) { throw new Error('伺服器回應錯誤，請確認已部署新版本'); }
    if (o && o.ok === false) throw new Error(o.error || '失敗');
    return o;
  });
}

function showLogin() { $('loading').style.display = 'none'; $('app').style.display = 'none'; $('nav').style.display = 'none'; $('login').style.display = 'block'; }
function login() { TK = $('pw').value.trim(); if (!TK) return; store('tk', TK); load(); }

function indexTx() { (D.tx || []).forEach(function (t, i) { t._i = i; }); }
function showApp() { $('loading').style.display = 'none'; $('login').style.display = 'none'; $('app').style.display = 'block'; $('nav').style.display = 'flex'; }
function setSync(t) { var e = $('syncTxt'); if (e) e.textContent = '含股票' + (t ? '・' + t : ''); }
var LOADING = false;
function load() {
  if (!D) {   // 先用上次存在手機裡的資料秒開，背景再更新
    var c = stored('cacheD');
    if (c) { try { D = JSON.parse(c); indexTx(); showApp(); renderAll(); setSync('更新中…'); } catch (e) { D = null; } }
  }
  if (!D) { $('loading').style.display = 'block'; $('loading').textContent = '讀取中…'; $('loading').onclick = null; $('login').style.display = 'none'; }
  else setSync('更新中…');
  if (LOADING) return LOADING;
  LOADING = api({ action: 'data', token: TK }).then(function (o) {
    D = o; indexTx();
    try { store('cacheD', JSON.stringify(o)); } catch (e) {}
    showApp(); renderAll();
    var n = new Date(); setSync('已更新 ' + n.getHours() + ':' + String(n.getMinutes()).padStart(2, '0'));
  }).catch(function (e) {
    if (/token|密碼/.test(e && e.message || '')) { store('tk', null); store('cacheD', null); D = null; showLogin(); }
    else if (!D) { $('loading').textContent = '讀取失敗，點這裡重試'; $('loading').onclick = load; }
    else setSync('離線，顯示上次的資料');
    toast(e && e.message ? e.message : '讀取失敗');
  }).then(function () { LOADING = false; });
  return LOADING;
}

function go(i) {
  var pages = document.querySelectorAll('.page'), btns = document.querySelectorAll('nav button');
  for (var k = 0; k < pages.length; k++) { pages[k].classList.toggle('on', k === i); btns[k].classList.toggle('on', k === i); }
  if (i === 1) { drawChart(); renderCal(); }
  $('vToggle').style.display = i === 2 ? 'flex' : 'none';
  $('app').scrollTop = 0;
}

function renderAll() { BALIX = null; renderOverview(); try { renderInsights(); } catch (e) {} try { if (STTAB === 'd') renderDiv(); if ($('stk').style.display === 'block') renderStock(); } catch (e) {} try { renderStories(); } catch (e) {} try { renderSpark(); } catch (e) {} renderStocks(); renderCal(); renderTxOptions(); renderTx(); renderForm(); }

/* ---------- 總覽 ---------- */
function renderOverview() {
  var s = D.summary, st = D.stockSum;
  var stock = num(st.total) ? st.total : (num(s.stock) ? s.stock : 0);
  var total = num(s.total) ? s.total : (num(s.net) ? s.net + stock : null);
  $('netTotal').textContent = '$' + fmt(total);
  $('sDep').textContent = fmt(s.deposit);
  $('sStock').textContent = fmt(stock);
  $('sDebt').textContent = fmt(s.debt);

  var parts = [{ n: '存款', v: s.deposit }, { n: '台股', v: st.tw }, { n: '美股', v: st.us }].filter(function (p) { return num(p.v) && p.v > 0; });
  var sum = parts.reduce(function (a, p) { return a + p.v; }, 0);
  $('allocBar').innerHTML = parts.map(function (p, i) { return '<div style="width:' + (p.v / sum * 100) + '%;background:' + COLORS[i] + '"></div>'; }).join('');
  $('allocLegend').innerHTML = parts.map(function (p, i) { return '<span><i style="background:' + COLORS[i] + '"></i>' + esc(p.n) + ' ' + Math.round(p.v / sum * 100) + '%</span>'; }).join('');

  $('accList').innerHTML = D.accounts.map(function (a) {
    var orig = a.cur !== 'TWD' ? '<div class="muted">' + esc(a.cur) + ' ' + fmt(a.bal, 2) + '</div>' : '';
    var av = accAvatar(a.name);
    return '<div class="row" onclick="showAcc(this.dataset.n)" data-n="' + esc(a.name) + '"><div class="l"><div class="aav" style="background:' + av.c + '">' + esc(av.t) + '</div><div><div class="name">' + esc(a.name) + '</div>' + (orig || '<div class="muted">' + esc(a.cur || 'TWD') + '</div>') + '</div></div><div class="r ' + (num(a.twd) && a.twd < 0 ? 'down' : '') + '">' + fmt(a.twd) + '</div></div>';
  }).join('');
}

/* ---------- 股票 ---------- */
function renderStocks() {
  var st = D.stockSum, fx = num(st.fx) ? st.fx : 1;
  var stTot = '$' + fmt(st.total);
  var cost = 0, val = 0;
  D.stocks.forEach(function (x) { if (num(x.twd) && num(x.cost)) { val += x.twd; cost += x.cur === 'USD' ? x.cost * fx : x.cost; } });
  var p = val - cost;
  $('stTotal').innerHTML = stTot + ' <span class="' + cls(p) + '" style="font-size:18px;font-weight:600;vertical-align:4px;margin-left:6px">' + pct(cost ? p / cost : null) + '</span>';
  $('stPnl').innerHTML = '<div class="grid3" style="margin-top:4px">' +
    '<div><div class="muted">總成本</div><div class="v">' + fmt(cost) + '</div></div>' +
    '<div><div class="muted">總損益</div><div class="v ' + cls(p) + '">' + sgn(p) + '</div></div>' +
    '<div><div class="muted">美金匯率</div><div class="v">' + fmt(fx, 2) + '</div></div></div>';

  if (!$('chY').options.length) { var nd = new Date(); fillYM('chY', 'chM', nd.getFullYear(), 'y', true); $('chY').insertAdjacentHTML('afterbegin', '<option value="all">全部</option>'); $('chY').value = nd.getFullYear(); }
  var mk = $('stF').value;
  var list = D.stocks.filter(function (x) { return !mk || (x.market || (x.cur === 'USD' ? '美股' : '台股')) === mk; }).sort(function (a, b) { return (num(b.twd) ? b.twd : 0) - (num(a.twd) ? a.twd : 0); });
  var lv = 0, lc = 0;
  list.forEach(function (x) { if (num(x.twd) && num(x.cost)) { lv += x.twd; lc += x.cur === 'USD' ? x.cost * fx : x.cost; } });
  var lp = lv - lc;
  $('stSum').innerHTML = '<div><div class="muted">市值</div><div class="v">' + fmt(lv) + '</div></div>' +
    '<div><div class="muted">成本</div><div class="v">' + fmt(lc) + '</div></div>' +
    '<div><div class="muted">未實現損益</div><div class="v ' + cls(lp) + '">' + sgn(lp) + '</div><div class="muted ' + cls(lp) + '">' + pct(lc ? lp / lc : null) + '</div></div>';
  // 同一代號（例如國泰、富邦的台積電）合併成一列
  var merged = [], byCode = {};
  list.forEach(function (x) {
    var m = byCode[x.code];
    if (!m) { m = byCode[x.code] = { code: x.code, name: x.name, cur: x.cur, price: x.price, qty: 0, cost: 0, twd: 0 }; merged.push(m); }
    m.qty += num(x.qty) ? x.qty : 0; m.cost += num(x.cost) ? x.cost : 0; m.twd += num(x.twd) ? x.twd : 0;
  });
  merged.sort(function (a, b) { return b.twd - a.twd; });
  $('stList').innerHTML = merged.map(function (x) {
    var us = x.cur === 'USD', avg = x.qty ? x.cost / x.qty : null;
    var r = num(x.price) && x.cost ? (x.qty * x.price - x.cost) / x.cost : null;
    var pnl = x.twd - (us ? x.cost * fx : x.cost);
    var cell = function (k, v) { return '<div><div class="k">' + k + '</div><div class="v">' + v + '</div></div>'; };
    return '<div class="hold" onclick="openStock(\'' + esc(x.code) + '\')">' +
      '<div class="hh"><div class="nm">' + esc(x.name) + '<span class="cd">' + esc(x.code) + '</span><span class="px">' + (num(x.price) ? fmt(x.price, 2) : esc(x.price)) + '</span></div><div class="mv">' + fmt(x.twd) + '</div></div>' +
      '<div class="hs"><span class="tg">' + (us ? '美股・USD' : '台股・TWD') + '</span><span class="' + cls(pnl) + '">' + sgn(pnl) + '　' + pct(r) + '</span></div>' +
      '<div class="hg">' + cell('股數', fmt(x.qty, us ? 4 : 0)) + cell('均價', fmt(avg, 2)) + cell('成本', fmt(x.cost, us ? 2 : 0)) + '</div>' +
      '</div>';
  }).join('');
}

/* ---------- 股票：分頁、配息、個股 ---------- */
var STTAB = 'v';
function stTab(t) {
  STTAB = t; $('skTabV').classList.toggle('on', t === 'v'); $('skTabD').classList.toggle('on', t === 'd');
  $('stVal').style.display = t === 'v' ? 'block' : 'none'; $('stDiv').style.display = t === 'd' ? 'block' : 'none';
  if (t === 'd') renderDiv(); else { drawChart(); renderCal(); }
}
function stockCodes() { var m = {}; D.stocks.forEach(function (x) { if (!m[x.code]) m[x.code] = { code: x.code, name: x.name, cur: x.cur }; }); return m; }
function divCode(note) {   // 帳本股息備註 → 代號
  var n = String(note || '').replace(/,/g, ''), m = stockCodes(), best = null;
  Object.keys(m).forEach(function (c) {
    var x = m[c], c2 = c.replace(/^0+/, '');
    if (n.indexOf(c) >= 0 || (c2.length >= 4 && new RegExp('(^|\\D)' + c2 + '(\\D|$)').test(n)) || (x.name && n.indexOf(String(x.name).slice(0, 3)) >= 0)) best = best || c;
  });
  if (!best && /台積/.test(n)) best = '2330';
  return best;
}
function fxAt(d) { var i = lastAt(D.hist, d, 'd'), h = i >= 0 ? D.hist[i] : null; return h && num(h.fx) ? h.fx : (num(D.stockSum.fx) ? D.stockSum.fx : 32); }
function divRows() {
  var m = stockCodes();
  return D.tx.filter(function (t) { return t.cat === '股息' && amt(t.inc) > 0 && t.ty !== '不計'; }).map(function (t) {
    var code = divCode(t.note), c = cur(t), v = amt(t.inc);
    return { d: t.d, code: code, name: code ? m[code].name : (t.note || '股息'), cur: c, v: v, twd: c === 'USD' ? Math.round(v * fxAt(t.d)) : c === 'JPY' ? v * 0.21 : v, acc: t.acc };
  });
}
function divEstimates(rows) {   // 依每檔過去的配息間隔推下一次
  var by = {}, today = ymd(new Date()), out = [];
  rows.forEach(function (r) { var k = r.code || r.name; (by[k] = by[k] || []).push(r); });
  Object.keys(by).forEach(function (k) {
    var a = by[k].sort(function (x, y) { return x.d < y.d ? -1 : 1; }), last = a[a.length - 1];
    if (!last.code) return;
    var gaps = []; for (var i = 1; i < a.length; i++) gaps.push((new Date(a[i].d) - new Date(a[i - 1].d)) / 864e5);
    var g = gaps.length ? gaps.sort(function (x, y) { return x - y; })[Math.floor(gaps.length / 2)] : 365;
    g = g < 45 ? 30 : g < 135 ? 91 : g < 270 ? 182 : 365;
    var nd = new Date(last.d + 'T00:00:00'); nd.setDate(nd.getDate() + g);
    while (ymd(nd) < today) nd.setDate(nd.getDate() + g);
    out.push({ d: ymd(nd), code: last.code, name: last.name, cur: last.cur, v: last.v, twd: last.cur === 'USD' ? Math.round(last.v * fxAt(today)) : last.v, est: true });
  });
  return out.sort(function (x, y) { return x.d < y.d ? -1 : 1; });
}
var DVM = null;
function daysTo(d) { var n = Math.round((new Date(d + 'T00:00:00') - new Date(ymd(new Date()) + 'T00:00:00')) / 864e5); return n === 0 ? '今天' : n > 0 ? n + ' 天後' : (-n) + ' 天前'; }
function renderDiv() {
  var rows = divRows(), est = divEstimates(rows), now = new Date(), y = now.getFullYear(), today = ymd(now);
  if (!DVM) DVM = new Date(y, now.getMonth(), 1);
  var ytd = rows.filter(function (r) { return r.d.slice(0, 4) === String(y); }).reduce(function (s, r) { return s + r.twd; }, 0);
  var y1 = new Date(now); y1.setFullYear(y - 1);
  var last12 = rows.filter(function (r) { return r.d > ymd(y1); }).reduce(function (s, r) { return s + r.twd; }, 0);
  var nx = est[0];
  var mk = DVM.getFullYear() + '-' + String(DVM.getMonth() + 1).padStart(2, '0');
  var got = {}, exp = {};
  rows.forEach(function (r) { if (r.d.slice(0, 7) === mk) got[+r.d.slice(8)] = 1; });
  est.forEach(function (r) { if (r.d.slice(0, 7) === mk) exp[+r.d.slice(8)] = 1; });
  var first = new Date(DVM.getFullYear(), DVM.getMonth(), 1), dim = new Date(DVM.getFullYear(), DVM.getMonth() + 1, 0).getDate(), cal = '';
  ['日','一','二','三','四','五','六'].forEach(function (w) { cal += '<div class="wh">' + w + '</div>'; });
  for (var i = 0; i < first.getDay(); i++) cal += '<div></div>';
  for (var d = 1; d <= dim; d++) {
    var key = mk + '-' + String(d).padStart(2, '0');
    cal += '<div class="d' + (got[d] || exp[d] ? ' has' : '') + (key === today ? ' today' : '') + '"><b>' + d + '</b><i class="' + (got[d] ? '' : exp[d] ? 'est' : 'none') + '"></i></div>';
  }
  var list = rows.filter(function (r) { return r.d.slice(0, 7) === mk; }).concat(est.filter(function (r) { return r.d >= mk && r.d.slice(0, 7) <= ymKey(new Date(DVM.getFullYear(), DVM.getMonth() + 2, 1)); }))
    .sort(function (a, b) { return a.d < b.d ? -1 : 1; });
  var line = function (r) {
    return '<div class="dvrow"><div>' + (+r.d.slice(5, 7)) + '/' + (+r.d.slice(8)) + '</div><div class="nm">' + esc(r.code || '') + '<small>' + esc(r.name) + '</small></div>' +
      '<div class="r">' + money(r.v, r.cur) + '<small>' + (r.est ? '預估・' + daysTo(r.d) : '已入帳') + '</small></div></div>';
  };
  // 每檔累計
  var per = {}; rows.forEach(function (r) { var k = r.code || r.name; per[k] = per[k] || { k: k, name: r.name, twd: 0, n: 0 }; per[k].twd += r.twd; per[k].n++; });
  var perL = Object.keys(per).map(function (k) { return per[k]; }).sort(function (a, b) { return b.twd - a.twd; });
  $('stDiv').innerHTML =
    '<div class="card"><div class="muted">下一筆配息（預估）</div>' + (nx ? '<div class="dvnext"><div class="when">' + daysTo(nx.d) + '<div class="muted" style="font-size:13px;font-weight:500">' + esc(nx.code) + ' ' + esc(nx.name) + '・' + (+nx.d.slice(5, 7)) + '/' + (+nx.d.slice(8)) + '</div></div><div class="amt"><small>' + (nx.cur === 'USD' ? 'US$' : 'NT$') + '</small>' + fmt(nx.v, nx.cur === 'USD' ? 2 : 0) + '</div></div>' : '<div class="dvnext">—</div>') + '</div>' +
    '<div class="dv2"><div class="card dvbox"><div class="muted">今年累計配息</div><div class="v"><small>NT$</small>' + fmt(ytd) + '</div></div>' +
    '<div class="card dvbox"><div class="muted">近 12 月平均每月</div><div class="v"><small>NT$</small>' + fmt(Math.round(last12 / 12)) + '</div></div></div>' +
    '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><span class="muted">配息日曆</span><div class="mnav"><button onclick="dvMove(-1)">‹</button><b>' + DVM.getFullYear() + ' 年 ' + (DVM.getMonth() + 1) + ' 月</b><button onclick="dvMove(1)">›</button></div></div>' +
    '<div class="dcal">' + cal + '</div><div class="dleg"><span><i></i>已入帳</span><span><i class="est"></i>預估</span></div>' +
    '<div style="margin-top:8px">' + (list.map(line).join('') || '<div class="muted" style="padding:10px 0">這個月沒有配息</div>') + '</div></div>' +
    '<div class="card"><h2>各檔累計配息</h2>' + perL.map(function (x) { return '<div class="dvrow" onclick="' + (stockCodes()[x.k] ? 'openStock(\'' + x.k + '\')' : '') + '"><div>' + x.n + ' 次</div><div class="nm">' + esc(stockCodes()[x.k] ? x.k : '') + '<small>' + esc(x.name) + '</small></div><div class="r">NT$' + fmt(x.twd) + '</div></div>'; }).join('') +
    '<div class="muted" style="font-size:11px;margin-top:6px">美股股息用入帳當天匯率換成台幣；預估日期和金額依過去的配息間隔推算。</div></div>';
}
function dvMove(k) { DVM = new Date(DVM.getFullYear(), DVM.getMonth() + k, 1); renderDiv(); }

/* 個股頁 */
var SK = { code: null, r: 12, chart: null };
function skSeries(code) {

var NETCATS = { '出國': 1 };
function isNet(t) { return NETCATS[t.cat] && amt(t.inc) > 0; }
function cur(t) { return t.cur === 'USD' || t.cur === 'JPY' ? t.cur : 'TWD'; }
function curSym(c) { return c === 'USD' ? 'US$' : c === 'JPY' ? '¥' : '$'; }
function money(n, c) { c = c || 'TWD'; return curSym(c) + fmt(n, c === 'USD' || (n % 1 && c !== 'JPY') ? 2 : 0); }
function short(n) { return n >= 100000 ? (n / 10000).toFixed(1) + '萬' : n >= 10000 ? (n / 10000).toFixed(2) + '萬' : fmt(n); }
function shortC(n, c) { return c === 'TWD' ? short(n) : curSym(c) + (c === 'USD' ? fmt(n, n < 100 ? 2 : 0) : short(n)); }
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function sums(rows) {
  var s = {}; CURS.forEach(function (c) { s[c] = { i: 0, o: 0 }; });
  rows.forEach(function (t) { if (counted(t)) { var c = cur(t); if (isNet(t)) s[c].o -= amt(t.inc); else { s[c].i += amt(t.inc); s[c].o += amt(t.out); } } });
  return s;
}

  $('txAcc').innerHTML = '<option value="">全部帳戶</option>' + names.map(function (n) { return '<option>' + esc(n) + '</option>'; }).join('');
  $('txAcc').value = c;

}
function txMove(k) {

function periodRows(acc) {
  var key = TXYEAR ? String(TXM.getFullYear()) : TXM.getFullYear() + '-' + String(TXM.getMonth() + 1).padStart(2, '0');
  return D.tx.filter(function (t) { return t.d.slice(0, key.length) === key && (!acc || t.acc === acc); });
}
function sortRows(rows) {
  return rows.sort(function (a, b) { var ka = a.d + ' ' + a.t.padStart(5, '0'), kb = b.d + ' ' + b.t.padStart(5, '0'); return ka < kb ? 1 : (ka > kb ? -1 : 0); });
}
function sumLine(s) {
  var parts = [];
  CURS.forEach(function (c) {
    if (s[c].i) parts.push('<span class="gi">收</span> <span class="s">' + money(s[c].i, c) + '</span>');
    if (s[c].o) parts.push('<span class="ro">支</span> <span class="s">' + money(s[c].o, c) + '</span>');
  });
  return parts.join('　');
}
function dayGroups(rows, idPrefix) {
  var groups = {}, order = [];
  sortRows(rows).forEach(function (t) { if (!groups[t.d]) { groups[t.d] = []; order.push(t.d); } groups[t.d].push(t); });
  return order.map(function (d) {
    var dt = new Date(d + 'T00:00:00');
    return '<div class="dgrp"' + (idPrefix ? ' id="' + idPrefix + d + '"' : '') + '><div class="dgh"><span>' + (dt.getMonth() + 1) + '月' + dt.getDate() + '日 週' + WK[dt.getDay()] + '</span><span style="text-align:right">' + sumLine(sums(groups[d])) + '</span></div>' +
      groups[d].map(function (t) {
        var isOut = t.out !== '' && t.out != null, v = amt(isOut ? t.out : t.inc), c = counted(t);
        var a = (isOut ? '-' : '+') + money(v, cur(t));

          '<div class="r"><div class="a ' + (!c ? 'x' : isOut ? 'ro' : 'gi') + '">' + a + '</div><div class="m">' + esc(t.acc) + '・' + esc(t.t) + '</div></div></div>';
      }).join('') + '</div>';
  }).join('');
}
function cellAmts(s) {

  if (s.TWD.o) h += '<div class="ro">' + short(s.TWD.o) + '</div>';
  ['USD', 'JPY'].forEach(function (c) {

}
function totalsHtml(s) {

    '<div class="cl">台幣 $</div><div class="big gi">' + fmt(t.i) + '</div><div class="big ro">' + fmt(t.o) + '</div><div class="big">' + (t.i - t.o < 0 ? '-' : '') + fmt(Math.abs(t.i - t.o)) + '</div>';
  ['USD', 'JPY'].forEach(function (c) {

/* ---------- 報表 ---------- */
function catTotals(kind) {
  var acc = $('txAcc').value, by = {}, total = 0;
  periodRows(acc).forEach(function (t) {
    if (!counted(t)) return;
    var v = amt(kind === 'out' ? t.out : t.inc);
    if (isNet(t)) { if (kind !== 'out') return; v = -amt(t.inc); }
    if (!v) return;
    var k = t.cat || '未分類', c = cur(t);
    var o = by[k] || (by[k] = { v: 0, n: 0, fx: {} });
    o.n++;
    if (c === 'TWD') { o.v += v; total += v; } else o.fx[c] = (o.fx[c] || 0) + v;
  });
  var list = Object.keys(by).map(function (k) { return { c: k, v: by[k].v, n: by[k].n, fx: by[k].fx }; }).sort(function (a, b) { return b.v - a.v; });
  return { list: list, total: total };
}
function renderReport() {
  var out = catTotals('out'), inc = catTotals('in'), cr = RKIND === 'out' ? out : inc;
  var R = 70, r = 44, cx = 90, cy = 90, a0 = -Math.PI / 2, svg = '';
  if (cr.total > 0) {
    cr.list.forEach(function (x) {
      if (!x.v) return;
      var f = x.v / cr.total, a1 = a0 + f * Math.PI * 2;
      if (f >= 0.9999) { svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + ((R + r) / 2) + '" fill="none" stroke="' + ccolor(x.c) + '" stroke-width="' + (R - r) + '"/>'; }
      else {
        var lg = a1 - a0 > Math.PI ? 1 : 0, p = function (rad, a) { return (cx + rad * Math.cos(a)).toFixed(2) + ' ' + (cy + rad * Math.sin(a)).toFixed(2); };
        svg += '<path d="M' + p(R, a0) + ' A' + R + ' ' + R + ' 0 ' + lg + ' 1 ' + p(R, a1) + ' L' + p(r, a1) + ' A' + r + ' ' + r + ' 0 ' + lg + ' 0 ' + p(r, a0) + 'Z" fill="' + ccolor(x.c) + '" stroke="var(--card)" stroke-width="1.5"/>';
      }
      if (f >= 0.06) { var am = (a0 + a1) / 2, lr = (R + r) / 2; svg += '<text x="' + (cx + lr * Math.cos(am)).toFixed(1) + '" y="' + (cy + lr * Math.sin(am) + 4).toFixed(1) + '" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">' + Math.round(f * 100) + '%</text>'; }
      a0 = a1;
    });
  } else svg = '<circle cx="90" cy="90" r="57" fill="none" stroke="var(--card2)" stroke-width="26"/>';
  svg += '<text x="90" y="86" text-anchor="middle" font-size="12" fill="var(--muted)">' + (RKIND === 'out' ? '支出' : '收入') + '</text><text x="90" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="var(--text)">' + short(cr.total) + '</text>';
  $('donut').innerHTML = '<svg width="180" height="180" viewBox="0 0 180 180">' + svg + '</svg>';
  function fxOf(t) { var s = { TWD: t.total }; t.list.forEach(function (x) { for (var c in x.fx) s[c] = (s[c] || 0) + x.fx[c]; }); return s; }
  var si = fxOf(inc), so = fxOf(out);
  var g = '<div class="cl"></div><button class="in ' + (RKIND === 'in' ? 'on' : '') + '" onclick="RKIND=\'in\';renderReport()">收入</button>' +
    '<button class="' + (RKIND === 'out' ? 'on' : '') + '" onclick="RKIND=\'out\';renderReport()">支出</button>';
  CURS.forEach(function (c) {
    var a = si[c] || 0, b = so[c] || 0, dp = c === 'USD' ? 2 : 0;

  });
  $('kseg').innerHTML = g;
  $('catStat').innerHTML = cr.list.map(function (x) {
    var f = cr.total ? x.v / cr.total : 0, fx = Object.keys(x.fx).map(function (c) { return money(x.fx[c], c); }).join('　');
    return '<div class="crow" data-c="' + esc(x.c) + '">' + icon(x.c) + '<div class="l"><div class="top"><span class="nm">' + esc(x.c) + (x.v ? '<span class="pc">' + (f * 100).toFixed(2) + '%</span>' : '') + '</span><span class="amt">' + (x.v ? money(x.v) : '') + '</span></div>' +
      (fx ? '<div class="fxl" style="text-align:right">' + fx + '</div>' : '') +
      '<div class="bt"><div class="bar2"><i style="width:' + (f * 100).toFixed(1) + '%;background:' + ccolor(x.c) + '"></i></div><span class="cnt">' + x.n + ' 筆</span></div></div><span class="chev">›</span></div>';
  }).join('') || '<div class="muted" style="text-align:center;padding:16px 0">' + (TXYEAR ? '今年' : '這個月') + '沒有' + (RKIND === 'out' ? '支出' : '收入') + '</div>';
}

function renderForm() {
  var cur = $('fAcc').value;
  $('fAcc').innerHTML = D.accounts.map(function (a) { return '<option>' + esc(a.name) + '</option>'; }).join('');
  if (cur) $('fAcc').value = cur;
  var cnt = {}, notes = {};
  D.tx.forEach(function (t) {

    cnt[t.cat] = (cnt[t.cat] || 0) + 1;
    if (t.note) (notes[t.cat] = notes[t.cat] || {})[t.note] = 1;
  });
  NOTES = notes;
  var cats = Object.keys(cnt).sort(function (a, b) { return cnt[b] - cnt[a]; });
  $('catList').innerHTML = cats.map(function (s) { return '<option value="' + esc(s) + '">'; }).join('');
  $('catChips').innerHTML = cats.slice(0, 10).map(function (s) { return '<button type="button" data-c="' + esc(s) + '">' + esc(s) + '</button>'; }).join('');
  syncCat();
}
var NOTES = {};
function syncCat() {
  var c = $('fCat').value.trim(), btns = $('catChips').querySelectorAll('button');
  for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('on', btns[i].getAttribute('data-c') === c);

function setKind(k) { kind = k; $('kOut').classList.toggle('on', k === '支出'); $('kIn').classList.toggle('on', k === '收入'); }
function addEntry() {
  var amt = parseFloat($('fAmt').value), acc = $('fAcc').value, cat = $('fCat').value.trim(), note = $('fNote').value.trim();
  if (!(amt > 0)) { toast('請輸入金額'); return; }
  if (!cat) { toast('請選分類'); return; }
  $('fBtn').disabled = true;
  api({ action: 'quick', token: TK, account: acc, amount: amt, kind: kind, cat: cat, note: note }, true).then(function (r) {
    toast('已記錄，' + acc + ' 結餘 ' + fmt(r.balance, 2));
    $('fAmt').value = ''; $('fNote').value = '';

  }).catch(function (e) { toast(e && e.message ? e.message : '記錄失敗'); })
    .then(function () { $('fBtn').disabled = false; });
}

var ETX = null;
function editTx(i) {

function closeEdit() { if ($('editSheet').style.display === 'flex') unlockScroll(); $('editSheet').style.display = 'none'; ETX = null; }

function editFail(e) {

  else toast(m);

function saveEdit() {

  var cat = $('eCat').value.trim(), note = $('eNote').value.trim(), a = parseFloat($('eAmt').value);
  var d = $('eDate').value, tm = $('eTime').value, acc = $('eAcc').value;
  if (!cat) { toast('請填分類'); return; }
  if (!(a > 0)) { toast('請輸入金額'); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) { toast('請選日期'); return; }
  var ty = $('eNoCnt').checked ? '不計' : (t.ty === '不計' || t.ty === '推播' ? '一般' : (t.ty || '一般'));
  var set = {};

  if (note !== (t.note || '')) set.note = note;
  if (ty !== (t.ty || '')) set.type = ty;

  if (d !== t.d) set.date = d;

  $('trList').innerHTML = rows.reverse().map(function (x) {
    return '<div class="trrow"><div class="tt">' + esc(x.t) + '</div><div class="tv"><div>$' + fmt(x.v) + '</div>' + (x.ch === null ? '' : '<div class="tc ' + cls(x.ch) + '">' + (x.ch > 0 ? '+' : x.ch < 0 ? '-' : '') + '$' + fmt(Math.abs(x.ch)) + '</div>') + '</div></div>';
  }).join('') || '<div class="muted" style="text-align:center;padding:16px 0">這段期間沒有資料</div>';
}
function renderSpark() {
  buildBalIndex();
  var today = new Date(), vals = [];
  for (var i = 89; i >= 0; i -= 3) { var k = ymd(new Date(today.getFullYear(), today.getMonth(), today.getDate() - i)); if (k >= BALIX.start) vals.push(worthAt(k).net); }
  if (vals.length < 2) { $('spark').innerHTML = ''; return; }
  var el = $('spark'), W = Math.max(120, el.clientWidth || 300), H = 72, mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals), rg = mx - mn || 1;
  var p = vals.map(function (v, i) { return (i * W / (vals.length - 1)).toFixed(1) + ',' + (4 + (H - 8) * (1 - (v - mn) / rg)).toFixed(1); });
  var ch = vals[vals.length - 1] - vals[0];
  el.innerHTML = '<svg width="100%" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none"><polyline points="0,' + H + ' ' + p.join(' ') + ' ' + W + ',' + H + '" fill="rgba(255,255,255,.18)" stroke="none"/><polyline points="' + p.join(' ') + '" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg><div class="muted" style="font-size:11.5px;display:flex;justify-content:space-between"><span>近 90 天 ' + (ch >= 0 ? '+' : '-') + '$' + fmt(Math.abs(ch)) + '</span><span>看趨勢 ›</span></div>';
}


var AVC = ['#a8876a', '#8c9a7b', '#b98b73', '#7f8c99', '#c4a77d', '#9c7f8e', '#6f7f6a', '#b0956f'];
function accShort(n) {
  var s = n.replace('中國信託中油卡', '中油卡').replace('中國信託', '中信').replace('國泰世華銀行', '國泰').replace('世華', '').replace('銀行', '').replace('信用卡', '卡');
  return s.replace('美金', ' $').replace('日圓', ' ¥');
}
function accAvatar(n) { var s = accShort(n).replace(/[ $¥卡]/g, '').slice(0, 2), i = 0; for (var k = 0; k < n.length; k++) i += n.charCodeAt(k); return { t: s, c: AVC[i % AVC.length] }; }
function showAcc(n) { go(2); $('txAcc').value = n; renderTx(); }
function renderStories() {
  var list = D.accounts.filter(function (a) { return num(a.twd) && Math.round(a.twd) !== 0; }).sort(function (a, b) { return Math.abs(b.twd) - Math.abs(a.twd); });
  if ($('stories')) $('stories').innerHTML = list.map(function (a) {
    var av = accAvatar(a.name), debt = a.twd < 0;
    return '<button class="st' + (debt ? ' debt' : '') + '" onclick="showAcc(this.dataset.n)" data-n="' + esc(a.name) + '"><div class="ring"><div style="background:' + av.c + '">' + esc(av.t) + '</div></div><div class="nm">' + esc(accShort(a.name)) + '</div><div class="bl">' + short(Math.abs(a.twd)) + '</div></button>';
  }).join('');
  $('accCnt').textContent = D.accounts.length + ' 個';
  var n = new Date(); $('syncTxt').textContent = '含股票 · ' + String(n.getHours()).padStart(2, '0') + ':' + String(n.getMinutes()).padStart(2, '0') + ' 更新';
}
