<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的記帳</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="記帳">
<meta name="theme-color" content="#1c1c1e">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{--bg:#1c1c1e;--card:#2c2c2e;--card2:#252527;--text:#f2f2f7;--muted:#98989f;--up:#ff6b6b;--down:#4cd08a;--line:#3a3a3c;--acc:#5b9bf3}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{margin:0;color:var(--text);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
/* iOS 27：整頁不捲動，只捲內層，狀態列下方用實心底色蓋住，避免頂端模糊 */
#sbar{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--bg);z-index:8}
#app{position:fixed;top:env(safe-area-inset-top);left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding-top:6px;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
#login,#loading{position:relative;top:env(safe-area-inset-top)}
h2{font-size:15px;color:var(--muted);font-weight:500;margin:0 0 6px}
.big{font-size:34px;font-weight:700;margin:2px 0 6px;letter-spacing:-.5px}
.card{background:var(--card);border-radius:14px;margin:12px;padding:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .l{min-width:0}.row .r{text-align:right;white-space:nowrap}
.name{font-size:15px}.muted{color:var(--muted);font-size:12px}
.up{color:var(--up)}.down{color:var(--down)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.grid3 .v{font-size:16px;font-weight:600;margin-top:4px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:10px 0 8px;background:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#111113;transform:translateZ(0);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:12px 0 10px;font-size:12px;font-family:inherit}
nav button.on{color:var(--acc)}
.page{display:none}.page.on{display:block}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.calhead button{background:none;border:0;color:var(--text);font-size:20px;padding:4px 12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal div{border-radius:8px;min-height:58px;padding:4px;font-size:10px;background:var(--card2);line-height:1.35;overflow:hidden}
.cal .h{min-height:auto;background:none;text-align:center;color:var(--muted);font-size:12px}
.cal .e{background:none}
.cal .pos{background:rgba(255,107,107,.18)}.cal .neg{background:rgba(76,208,138,.15)}
.cal b{font-size:12px;display:block;margin-bottom:2px}
select,input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;margin:6px 0 10px;font-family:inherit}
label{font-size:13px;color:var(--muted)}
.btn{width:100%;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:14px;font-size:16px;font-family:inherit}
.btn:disabled{opacity:.5}
.seg{display:flex;gap:8px;margin:6px 0 10px}
.seg button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--text);font-size:15px;font-family:inherit}
.seg button.on{background:var(--acc);border-color:var(--acc)}
#toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#3a3a3c;padding:10px 16px;border-radius:10px;display:none;z-index:9;font-size:14px}
#loading{text-align:center;color:var(--muted);padding:60px 0}
.refresh{float:right;background:none;border:0;color:var(--acc);font-size:13px;font-family:inherit}
.chartbox{position:relative;height:220px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.chips button{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:6px 12px;font-size:14px;font-family:inherit}
.chips button.on{background:var(--acc);border-color:var(--acc)}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--line);color:var(--text);margin-right:6px;vertical-align:1px}

/* ---------- 明細（記錄 / 報表） ---------- */
.lhead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 12px 0;gap:6px}
.accwrap{position:relative;min-width:0;color:var(--acc);font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:6px 0}
.accsel{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;padding:0;font-size:16px}
.mnav{display:flex;align-items:center;gap:4px;font-size:18px;font-weight:600;white-space:nowrap}
.mnav button{background:none;border:0;color:var(--acc);font-size:22px;padding:2px 10px;font-family:inherit}
.lspacer{}
.lcal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.lcal .wh{text-align:center;color:var(--muted);font-size:12px;padding:2px 0 4px}
.lcal .dc{background:var(--card2);border-radius:8px;min-height:54px;padding:3px 2px;text-align:center;font-size:9.5px;line-height:1.3;overflow:hidden;cursor:pointer}
.lcal .dc b{display:block;font-size:14px;font-weight:600;color:#c9c9f5;margin-bottom:1px}
.lcal .dc.other{opacity:.35}
.lcal .dc.today{background:#f5c542}.lcal .dc.today b{color:#1c1c1e}
.lcal .dc.today .gi{color:#0b6b36}.lcal .dc.today .ro{color:#b3261e}
.gi{color:var(--down)}.ro{color:var(--up)}
.ltot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.ltot .muted{font-size:12px}.ltot .v{font-size:19px;font-weight:700;margin-top:2px;letter-spacing:-.3px}
.ltot>div:nth-child(2){text-align:center}.ltot>div:last-child{text-align:right}
.dgrp{background:var(--card);border-radius:14px;margin:10px 12px;padding:4px 14px;scroll-margin-top:10px}
.dgh{display:flex;justify-content:space-between;font-size:13px;padding:10px 0 8px;border-bottom:1px solid var(--line)}
.dgh .s{font-weight:600}
.trow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.ic{flex:0 0 40px;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}
.trow .l{flex:1;min-width:0}.trow .l .c{font-size:15px;font-weight:600}
.trow .l .n{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .r{text-align:right;white-space:nowrap}.trow .r .a{font-size:16px;font-weight:600}
.trow .r .m{font-size:11px;color:var(--muted);margin-top:2px}
.a.x{color:var(--muted)}
#vToggle{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom));display:none;background:rgba(44,44,46,.92);border:1px solid var(--line);border-radius:20px;padding:3px;z-index:6;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
#vToggle button{background:none;border:0;color:var(--muted);font-size:14px;padding:7px 20px;border-radius:17px;font-family:inherit}
#vToggle button.on{background:#48484a;color:var(--text)}
#p3{padding-bottom:56px}
.kseg{display:flex;justify-content:center;gap:10px;margin:10px 0 2px}
.kseg button{background:none;border:0;border-radius:14px;padding:5px 14px;text-align:center;font-family:inherit;color:var(--text)}
.kseg button .t{font-size:13px}.kseg button .v{font-size:17px;font-weight:700;margin-top:2px}
.kseg button.on .t{background:var(--up);color:#fff;border-radius:10px;padding:1px 10px}
.kseg button.on.in .t{background:var(--down);color:#08361d}
.donut{display:flex;justify-content:center;margin-top:6px}
.crow{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer}
.crow .l{flex:1;min-width:0}
.crow .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.crow .nm{font-size:15px;font-weight:600}
.crow .pc{font-size:11px;color:var(--muted);background:var(--card2);border-radius:8px;padding:1px 6px;margin-left:6px;font-weight:400}
.crow .amt{font-size:15px;font-weight:600}
.crow .bt{display:flex;align-items:center;gap:10px;margin-top:6px}
.crow .bar2{flex:1;height:5px;background:var(--card2);border-radius:3px;overflow:hidden}
.crow .bar2 i{display:block;height:100%;border-radius:3px}
.crow .cnt{font-size:11px;color:var(--muted);white-space:nowrap}
.crow .chev{color:var(--muted);font-size:20px;padding-left:2px}
#sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;overscroll-behavior:contain;display:none;padding-top:env(safe-area-inset-top);padding-bottom:calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.shead{display:flex;align-items:center;justify-content:space-between;padding:10px 12px}
.shead button{background:none;border:0;color:var(--text);font-size:22px;padding:4px 10px;font-family:inherit}
.shead .mnav{font-size:16px}
.stot{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 4px}
.stot .t{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700}
.stot .v{font-size:17px;font-weight:700}

.cal div[data-d]{cursor:pointer}
#daySheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:none;align-items:flex-end;overscroll-behavior:contain;transition:background .2s}
.dpanel{background:var(--bg);width:100%;max-height:90vh;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;will-change:transform;border-radius:22px 22px 0 0;padding:6px 16px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:#48484a;margin:4px auto 6px}
.dtop{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:14px}
.dtop b{font-size:17px}
.dtop button{justify-self:end;background:#3a3a3c;color:#f5c542;border:0;border-radius:18px;padding:9px 16px;font-size:15px;font-weight:600;font-family:inherit}
.dhead .muted{font-size:13px}.dhead .bigp{font-size:28px;font-weight:700;margin:4px 0 14px;letter-spacing:-.3px}
.dhead .bigp span{margin-right:10px}
.dbox{background:var(--card);border-radius:14px;padding:2px 14px;margin-bottom:20px}
.drow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:0}
.drow .di{width:22px;text-align:center;font-size:16px}
.drow .dl{flex:1}.drow .dl .t{font-size:15px}.drow .dl .s{font-size:11px;color:var(--muted);margin-top:1px}
.drow .dv{font-size:16px;font-weight:600}
.drow.tot .t{font-weight:700}
.comp{display:grid;grid-template-columns:1fr 110px 92px;align-items:center;gap:8px;padding:9px 0}
.comp .cd{font-size:15px;font-weight:600}.comp .cm{font-size:11px;color:var(--muted)}.comp .cfx{font-size:11px;color:#f0a35e}
.comp .cb{position:relative;height:12px}
.comp .cb:before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--line)}
.comp .cb i{position:absolute;top:0;height:12px;border-radius:3px}
.comp .ca{text-align:right;font-size:15px;font-weight:600}
</style>
</head>
<body>

<div id="login" class="card" style="margin-top:30vh;display:none">
  <h2>我的記帳</h2>
  <label>請輸入密碼</label>
  <input id="pw" type="password" autocomplete="current-password">
  <button class="btn" onclick="login()">登入</button>
</div>

<div id="sbar"></div>
<div id="loading">讀取中…</div>

<div id="app" style="display:none">
  <!-- 總覽 -->
  <section id="p0" class="page on">
    <div class="card">
      <button class="refresh" onclick="load()">重新整理</button>
      <h2>淨資產（含股票）</h2>
      <div class="big" id="netTotal">-</div>
      <div class="grid3">
        <div><div class="muted">存款</div><div class="v" id="sDep">-</div></div>
        <div><div class="muted">股票</div><div class="v" id="sStock">-</div></div>
        <div><div class="muted">負債</div><div class="v down" id="sDebt">-</div></div>
      </div>
      <div class="bar" id="allocBar"></div>
      <div class="legend" id="allocLegend"></div>
    </div>
    <div class="card"><h2>帳戶</h2><div id="accList"></div></div>
  </section>

  <!-- 股票 -->
  <section id="p1" class="page">
    <div class="card">
      <h2>股票總市值</h2>
      <div class="big" id="stTotal">-</div>
      <div id="stPnl" class="muted"></div>
      <div class="chartbox" style="margin-top:10px"><canvas id="histChart"></canvas></div>
    </div>
    <div class="card">
      <div class="calhead">
        <button onclick="moveMonth(-1)">‹</button>
        <div style="text-align:center"><div id="calTitle" style="font-weight:600">-</div><div id="calSum" class="muted"></div></div>
        <button onclick="moveMonth(1)">›</button>
      </div>
      <div class="cal" id="cal"></div>
      <div class="muted" style="margin-top:10px">點日期看當天損益組成・已扣除資金進出</div>
    </div>
    <div class="card"><h2>持股</h2><div id="stList"></div></div>
  </section>

  <!-- 明細 -->
  <section id="p3" class="page">
    <div class="lhead">
      <div class="accwrap"><span id="accLbl">全部帳戶</span> ▾<select id="txAcc" class="accsel" onchange="renderTx()"></select></div>
      <div class="mnav"><button onclick="txMove(-1)">‹</button><span id="txTitle"></span><button onclick="txMove(1)">›</button></div>
      <div class="lspacer"></div>
    </div>
    <div id="vRec">
      <div class="card">
        <div class="lcal" id="lcal"></div>
        <div class="ltot" id="ltot"></div>
      </div>
      <div id="dayList"></div>
    </div>
    <div id="vRep" style="display:none">
      <div class="card">
        <h2>類別</h2>
        <div class="donut" id="donut"></div>
        <div class="kseg" id="kseg"></div>
      </div>
      <div class="card"><h2>類別統計</h2><div id="catStat"></div></div>
    </div>
  </section>

  <!-- 記一筆 -->
  <section id="p4" class="page">
    <div class="card">
      <h2>記一筆</h2>
      <label>帳戶</label>
      <select id="fAcc"></select>
      <div class="seg">
        <button id="kOut" class="on" onclick="setKind('支出')">支出</button>
        <button id="kIn" onclick="setKind('收入')">收入</button>
      </div>
      <label>金額</label>
      <input id="fAmt" type="number" inputmode="decimal" placeholder="0">
      <label>分類</label>
      <div class="chips" id="catChips"></div>
      <input id="fCat" list="catList" placeholder="例：餐飲">
      <datalist id="catList"></datalist>
      <label>備註</label>
      <input id="fNote" list="noteList" placeholder="例：午餐 / 麥當勞（可留空）">
      <datalist id="noteList"></datalist>
      <button class="btn" id="fBtn" onclick="addEntry()">記錄</button>
      <div class="muted" style="margin-top:10px">時間自動填現在，結餘從該帳戶最新一筆往下算，類型標「快速」。</div>
    </div>
  </section>
</div>

<nav id="nav" style="display:none">
  <button class="on" onclick="go(0)">總覽</button>
  <button onclick="go(1)">股票</button>
  <button onclick="go(2)">明細</button>
  <button onclick="go(3)">記一筆</button>
</nav>

<div id="vToggle"><button id="tRec" class="on" onclick="setView('rec')">記錄</button><button id="tRep" onclick="setView('rep')">報表</button></div>

<div id="sheet">
  <div class="shead">
    <button onclick="closeSheet()">✕</button>
    <div class="mnav"><button onclick="txMove(-1)">‹</button><span id="shTitle"></span><button onclick="txMove(1)">›</button></div>
    <button style="visibility:hidden">✕</button>
  </div>
  <div class="stot" id="shTot"></div>
  <div id="shList"></div>
</div>

<div id="daySheet" onclick="if(event.target===this)closeDay()">
  <div class="dpanel">
    <div class="grab"></div>
    <div class="dtop"><span></span><b id="dTitle"></b><button onclick="closeDay()">完成</button></div>
    <div id="dBody"></div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
var TK = null, D = null, chart = null, calM = null, kind = '支出';
var COLORS = ['#5b9bf3', '#4cd08a', '#f0a35e', '#a78bfa', '#ff6b6b', '#f5c542', '#7dd3fc', '#98989f'];

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function num(n) { return typeof n === 'number' && isFinite(n); }
function fmt(n, dp) { return num(n) ? n.toLocaleString('zh-TW', { maximumFractionDigits: dp || 0, minimumFractionDigits: dp || 0 }) : '-'; }
function sgn(n, dp) { return num(n) ? (n > 0 ? '+' : '') + fmt(n, dp) : '-'; }
function pct(n) { return num(n) ? (n > 0 ? '+' : '') + (n * 100).toFixed(2) + '%' : ''; }
function cls(n) { return num(n) && n > 0 ? 'up' : (num(n) && n < 0 ? 'down' : ''); }
function toast(t) { var e = $('toast'); e.textContent = t; e.style.display = 'block'; setTimeout(function () { e.style.display = 'none'; }, 2500); }
function store(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function stored(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

var API = 'https://script.google.com/macros/s/AKfycbzg_pErTf2VVKW_DLk1n9AeiusZyk6DtfAWVkuUFonXD4At1AEw-NJ0_9GCi1_cDBtkgQ/exec';
function api(params, post) {
  var q = new URLSearchParams(params);
  var req = post ? fetch(API, { method: 'POST', body: q }) : fetch(API + '?' + q.toString());
  return req.then(function (r) { return r.text(); }).then(function (t) {
    var o; try { o = JSON.parse(t); } catch (e) { throw new Error('伺服器回應錯誤，請確認已部署新版本'); }
    if (o && o.ok === false) throw new Error(o.error || '失敗');
    return o;
  });
}

function showLogin() { $('loading').style.display = 'none'; $('app').style.display = 'none'; $('nav').style.display = 'none'; $('login').style.display = 'block'; }
function login() { TK = $('pw').value.trim(); if (!TK) return; store('tk', TK); load(); }

function load() {
  $('loading').style.display = 'block'; $('loading').textContent = '讀取中…'; $('loading').onclick = null; $('login').style.display = 'none';
  return api({ action: 'data', token: TK }).then(function (o) {
    D = o;
    $('loading').style.display = 'none'; $('app').style.display = 'block'; $('nav').style.display = 'flex';
    renderAll();
  }).catch(function (e) {
    if (/token|密碼/.test(e && e.message || '')) { store('tk', null); showLogin(); }
    else { $('loading').textContent = '讀取失敗，點這裡重試'; $('loading').onclick = load; }
    toast(e && e.message ? e.message : '讀取失敗');
  });
}

function go(i) {
  var pages = document.querySelectorAll('.page'), btns = document.querySelectorAll('nav button');
  for (var k = 0; k < pages.length; k++) { pages[k].classList.toggle('on', k === i); btns[k].classList.toggle('on', k === i); }
  if (i === 1) { drawChart(); renderCal(); }
  $('vToggle').style.display = i === 2 ? 'flex' : 'none';
  $('app').scrollTop = 0;
}

function renderAll() { renderOverview(); renderStocks(); renderCal(); renderTxOptions(); renderTx(); renderForm(); }

/* ---------- 總覽 ---------- */
function renderOverview() {
  var s = D.summary, st = D.stockSum;
  var stock = num(st.total) ? st.total : (num(s.stock) ? s.stock : 0);
  var total = num(s.total) ? s.total : (num(s.net) ? s.net + stock : null);
  $('netTotal').textContent = '$' + fmt(total);
  $('sDep').textContent = fmt(s.deposit);
  $('sStock').textContent = fmt(stock);
  $('sDebt').textContent = fmt(s.debt);

  var parts = [{ n: '存款', v: s.deposit }, { n: '台股', v: st.tw }, { n: '美股', v: st.us }].filter(function (p) { return num(p.v) && p.v > 0; });
  var sum = parts.reduce(function (a, p) { return a + p.v; }, 0);
  $('allocBar').innerHTML = parts.map(function (p, i) { return '<div style="width:' + (p.v / sum * 100) + '%;background:' + COLORS[i] + '"></div>'; }).join('');
  $('allocLegend').innerHTML = parts.map(function (p, i) { return '<span><i style="background:' + COLORS[i] + '"></i>' + esc(p.n) + ' ' + Math.round(p.v / sum * 100) + '%</span>'; }).join('');

  $('accList').innerHTML = D.accounts.map(function (a) {
    var orig = a.cur !== 'TWD' ? '<div class="muted">' + esc(a.cur) + ' ' + fmt(a.bal, 2) + '</div>' : '';
    return '<div class="row"><div class="l"><div class="name">' + esc(a.name) + '</div>' + orig + '</div><div class="r ' + (num(a.twd) && a.twd < 0 ? 'down' : '') + '">' + fmt(a.twd) + '</div></div>';
  }).join('');
}

/* ---------- 股票 ---------- */
function renderStocks() {
  var st = D.stockSum, fx = num(st.fx) ? st.fx : 1;
  $('stTotal').textContent = '$' + fmt(st.total);
  var cost = 0, val = 0;
  D.stocks.forEach(function (x) { if (num(x.twd) && num(x.cost)) { val += x.twd; cost += x.cur === 'USD' ? x.cost * fx : x.cost; } });
  var p = val - cost;
  $('stPnl').innerHTML = '總損益 <span class="' + cls(p) + '">' + sgn(p) + '（' + pct(cost ? p / cost : null) + '）</span>　美金匯率 ' + fmt(fx, 2);

  var list = D.stocks.slice().sort(function (a, b) { return (num(b.twd) ? b.twd : 0) - (num(a.twd) ? a.twd : 0); });
  $('stList').innerHTML = list.map(function (x) {
    var r = num(x.pct) ? x.pct / 100 : null;
    return '<div class="row"><div class="l"><div class="name">' + esc(x.name) + ' <span class="muted">' + esc(x.code) + '</span></div>' +
      '<div class="muted">' + esc(x.broker) + '・' + fmt(x.qty, x.cur === 'USD' ? 4 : 0) + ' 股・現價 ' + (num(x.price) ? fmt(x.price, 2) : esc(x.price)) + '</div></div>' +
      '<div class="r"><div>' + fmt(x.twd) + '</div><div class="muted ' + cls(r) + '">' + pct(r) + '</div></div></div>';
  }).join('');
}

function drawChart() {
  if (!window.Chart || !D) return;
  var pts = D.hist.filter(function (h) { return num(h.v); });
  var ctx = $('histChart');
  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    type: 'line',
    data: { labels: pts.map(function (h) { return h.d.slice(5); }), datasets: [{ data: pts.map(function (h) { return h.v; }), borderColor: '#5b9bf3', borderWidth: 2, pointRadius: 0, tension: .25, fill: true, backgroundColor: 'rgba(91,155,243,.12)' }] },
    options: {
      maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: function (c) { return '$' + fmt(c.parsed.y); } } } },
      interaction: { intersect: false, mode: 'index' },
      scales: { x: { ticks: { color: '#98989f', maxTicksLimit: 6 }, grid: { display: false } }, y: { ticks: { color: '#98989f', callback: function (v) { return (v / 10000).toFixed(0) + '萬'; } }, grid: { color: '#3a3a3c' } } }
    }
  });
}

/* ---------- 漲幅月曆 ---------- */
function moveMonth(k) { calM = new Date(calM.getFullYear(), calM.getMonth() + k, 1); renderCal(); }
function renderCal() {
  if (!calM) {
    var last = D.hist.length ? D.hist[D.hist.length - 1].d : null;
    var t = last ? new Date(last + 'T00:00:00') : new Date();
    calM = new Date(t.getFullYear(), t.getMonth(), 1);
  }
  var y = calM.getFullYear(), m = calM.getMonth();
  var map = {};
  D.hist.forEach(function (h) { map[h.d] = h; });
  var html = ['日', '一', '二', '三', '四', '五', '六'].map(function (w) { return '<div class="h">' + w + '</div>'; }).join('');
  var first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
  for (var i = 0; i < first; i++) html += '<div class="e"></div>';
  var sum = 0, prod = 1, n = 0, upDays = 0;
  for (var d = 1; d <= days; d++) {
    var key = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    var h = map[key], c = '', body = '';
    if (h && num(h.pnl)) {
      c = h.pnl > 0 ? 'pos' : (h.pnl < 0 ? 'neg' : '');
      body = '<span class="' + cls(h.pnl) + '">' + pct(h.pct) + '<br>' + sgn(h.pnl / 1000, 1) + 'k</span>';
      sum += h.pnl; if (num(h.pct)) prod *= 1 + h.pct; n++; if (h.pnl > 0) upDays++;
    }
    html += '<div class="' + c + '"' + (h && num(h.pnl) ? ' data-d="' + key + '"' : '') + '><b>' + d + '</b>' + body + '</div>';
  }
  $('cal').innerHTML = html;
  $('calTitle').textContent = y + ' 年 ' + (m + 1) + ' 月';
  $('calSum').innerHTML = n ? '當月 <span class="' + cls(sum) + '">' + pct(prod - 1) + '　' + sgn(sum) + '</span>　上漲 ' + upDays + '/' + n + ' 天' : '本月尚無資料';
}



/* ---------- 彈出視窗：鎖住背景捲動、下拉關閉 ---------- */
var lockY = 0, locks = 0;
function lockScroll() { if (locks++) return; $('app').style.overflowY = 'hidden'; }
function unlockScroll() { if (--locks > 0) return; locks = 0; $('app').style.overflowY = ''; }
(function () {
  var panel, sy = 0, dy = 0, drag = false, startTop = false;
  document.addEventListener('touchstart', function (e) {
    panel = e.target.closest && e.target.closest('.dpanel'); if (!panel) return;
    sy = e.touches[0].clientY; dy = 0; drag = false;
    startTop = panel.scrollTop <= 0 || !!e.target.closest('.grab,.dtop');
    panel.style.transition = '';
  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (!panel) return;
    var d = e.touches[0].clientY - sy;
    if (!drag && startTop && d > 6 && panel.scrollTop <= 0) drag = true;
    if (drag) {
      e.preventDefault();
      dy = Math.max(0, d);
      panel.style.transform = 'translateY(' + dy + 'px)';
      $('daySheet').style.background = 'rgba(0,0,0,' + (0.55 * Math.max(0, 1 - dy / 400)).toFixed(3) + ')';
    }
  }, { passive: false });
  document.addEventListener('touchend', function () {
    if (!panel) return;
    if (drag) {
      panel.style.transition = 'transform .22s ease-out';
      if (dy > 110) { panel.style.transform = 'translateY(100%)'; setTimeout(closeDay, 200); }
      else { panel.style.transform = ''; $('daySheet').style.background = ''; }
    }
    panel = null; drag = false;
  });
})();

/* ---------- 當日損益組成 ---------- */
function openDay(key) {
  var hs = D.hist, i = -1;
  for (var k = 0; k < hs.length; k++) if (hs[k].d === key) i = k;
  if (i < 1) return;
  var h = hs[i], p = hs[i - 1], cols = D.histCols || [], fx1 = h.fx, fx0 = p.fx;
  var byCode = {}, order = [], priceSum = 0, fxSum = 0, missing = false;
  var seen = {};
  function colOf(name, nth) { var k = -1; for (var c = 0; c < cols.length; c++) if (cols[c] === name && ++k === nth) return c; return -1; }
  D.stocks.forEach(function (s) {
    var nth = seen[s.code] = (seen[s.code] === undefined ? 0 : seen[s.code] + 1);
    var pc = colOf('價_' + s.code, nth), qc = colOf('股數_' + s.code, nth);
    var p1 = pc >= 0 && h.px ? h.px[pc] : null, p0 = pc >= 0 && p.px ? p.px[pc] : null;
    var q = qc >= 0 && p.px && num(p.px[qc]) ? p.px[qc] : s.qty;      // 用前一天收盤時的股數
    if (!num(p1) || !num(p0) || !num(q)) { missing = true; return; }
    var us = s.cur === 'USD', pr, fx = 0;
    if (us) { pr = q * (p1 - p0) * fx0; fx = q * p1 * (fx1 - fx0); } else pr = q * (p1 - p0);
    var o = byCode[s.code] || (byCode[s.code] = { code: s.code, mkt: s.market || (us ? '美股' : '台股'), us: us, v: 0, fx: 0 });
    if (!o.n) { o.n = 1; order.push(o); }
    o.v += pr + fx; o.fx += fx; priceSum += pr; fxSum += fx;
  });
  var total = num(h.pnl) ? h.pnl : priceSum + fxSum;
  if (missing) { priceSum = total - fxSum; }
  var dt = new Date(key + 'T00:00:00');
  $('dTitle').textContent = (dt.getMonth() + 1) + '月' + dt.getDate() + '日（' + WK[dt.getDay()] + '）';
  var c = function (v) { return Math.round(v) > 0 ? 'up' : Math.round(v) < 0 ? 'down' : ''; };
  var sv = function (v) { v = Math.round(v); return (v > 0 ? '+$' : v < 0 ? '-$' : '$') + fmt(Math.abs(v)); };
  var rows = [
    ['📈', '股價變動', '持股的價格漲跌', priceSum],
    ['💱', '匯率變動', '美股換算台幣的匯差', fxSum],
    ['⇄', '資金進出', '加碼／減碼（已從損益排除）', h.flow || 0]
  ];
  order.sort(function (a, b) { return Math.abs(b.v) - Math.abs(a.v); });
  var mx = order.reduce(function (m, o) { return Math.max(m, Math.abs(o.v)); }, 1);
  $('dBody').innerHTML =
    '<div class="dhead"><div class="muted">當日損益</div><div class="bigp ' + c(total) + '"><span>' + pct(h.pct) + '</span>' + sv(total) + '</div></div>' +
    '<div class="dbox">' + rows.map(function (r) {
      return '<div class="drow"><div class="di">' + r[0] + '</div><div class="dl"><div class="t">' + r[1] + '</div><div class="s">' + r[2] + '</div></div><div class="dv ' + (r[1] === '資金進出' ? '' : c(r[3])) + '">' + sv(r[3]) + '</div></div>';
    }).join('') + '<div class="drow tot"><div class="di"></div><div class="dl"><div class="t">合計</div></div><div class="dv ' + c(total) + '">' + sv(total) + '</div></div></div>' +
    '<h2>變動組成</h2><div class="muted" style="margin:-2px 0 8px">各檔當日損益（美股含匯率）' + (missing ? '・部分價格缺漏，只列出有資料的' : '') + '</div>' +
    (order.length ? order.map(function (o) {
      var w = Math.abs(o.v) / mx * 50, pos = o.v >= 0;
      return '<div class="comp"><div><div class="cd">' + esc(o.code) + '</div><div class="cm">' + esc(o.mkt) + '</div>' +
        (o.us && Math.round(o.fx) ? '<div class="cfx">其中匯率 ' + sv(o.fx) + '</div>' : '') + '</div>' +
        '<div class="cb"><i style="' + (pos ? 'left:50%' : 'right:50%') + ';width:' + w.toFixed(1) + '%;background:' + (pos ? 'var(--up)' : 'var(--down)') + '"></i></div>' +
        '<div class="ca ' + c(o.v) + '">' + sv(o.v) + '</div></div>';
    }).join('') : '<div class="muted">這天沒有各檔價格資料</div>');
  var pn = $('daySheet').querySelector('.dpanel');
  pn.style.transition = ''; pn.style.transform = ''; $('daySheet').style.background = '';
  if ($('daySheet').style.display !== 'flex') lockScroll();
  $('daySheet').style.display = 'flex';
  pn.scrollTop = 0;
}
function closeDay() { if ($('daySheet').style.display === 'flex') { $('daySheet').style.display = 'none'; unlockScroll(); } }

/* ---------- 明細 ---------- */
var TXM = null, VIEW = 'rec', RKIND = 'out', SHEETCAT = null;
var CN = ['一','二','三','四','五','六','七','八','九','十','十一','十二'], WK = ['日','一','二','三','四','五','六'];
var ICONS = {
  '餐飲':['🍜','#f5a524'], '交通':['🚗','#5b9bf3'], '運動':['🏸','#ef5350'], '娛樂':['🎮','#a78bfa'],
  '購物':['🛍️','#ec4899'], '網購':['📦','#f97316'], '貸款':['🏦','#64748b'], '保險':['🛡️','#7c8f6e'],
  '股票':['📈','#38bdf8'], '股息':['💰','#22c55e'], '薪資':['💼','#10b981'], '利息':['🪙','#eab308'],
  '轉帳':['🔁','#6b7280'], '卡費':['💳','#6b7280'], '代墊':['🤝','#14b8a6'], '父母':['👪','#f472b6'],
  '禮物':['🎁','#e11d48'], '電話':['📱','#0ea5e9'], '現金':['🏧','#84cc16'], '兼職':['🧰','#0d9488'],
  '信用卡回饋':['🎉','#facc15'], '信用卡刷退':['↩️','#94a3b8'], '中獎':['🎫','#f59e0b'], '退稅':['🧾','#22c55e']
};
function icon(cat) { var x = ICONS[cat] || ['🏷️', '#8e8e93']; return '<div class="ic" style="background:' + x[1] + '33">' + x[0] + '</div>'; }
function ccolor(cat) { return (ICONS[cat] || [0, '#8e8e93'])[1]; }
function amt(v) { return parseFloat(String(v == null ? '' : v).replace(/,/g, '')) || 0; }
function counted(t) { return !(t.cat === '轉帳' || t.cat === '卡費' || t.cat === '股票' || (t.cur && t.cur !== 'TWD')); }
function money(n) { return '$' + fmt(n); }
function short(n) { return n >= 100000 ? (n / 10000).toFixed(1) + '萬' : n >= 10000 ? (n / 10000).toFixed(2) + '萬' : fmt(n); }
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function curSym(c) { return c === 'USD' ? 'US$' : c === 'JPY' ? '¥' : '$'; }

function renderTxOptions() {
  var cur = $('txAcc').value;
  var names = D.accounts.map(function (a) { return a.name; });
  D.tx.forEach(function (t) { if (names.indexOf(t.acc) < 0) names.push(t.acc); });
  $('txAcc').innerHTML = '<option value="">全部帳戶</option>' + names.map(function (n) { return '<option>' + esc(n) + '</option>'; }).join('');
  $('txAcc').value = cur;
  if (!TXM) { var n = new Date(); TXM = new Date(n.getFullYear(), n.getMonth(), 1); }
}
function txMove(k) { TXM = new Date(TXM.getFullYear(), TXM.getMonth() + k, 1); renderTx(); if (SHEETCAT) { renderSheet(); $('sheet').scrollTop = 0; } else $('app').scrollTop = 0; }
function setView(v) { VIEW = v; $('tRec').classList.toggle('on', v === 'rec'); $('tRep').classList.toggle('on', v === 'rep'); renderTx(); $('app').scrollTop = 0; }

function monthRows(acc) {
  var key = TXM.getFullYear() + '-' + String(TXM.getMonth() + 1).padStart(2, '0');
  return D.tx.filter(function (t) { return t.d.slice(0, 7) === key && (!acc || t.acc === acc); });
}
function sortRows(rows) {
  return rows.sort(function (a, b) { var ka = a.d + ' ' + a.t.padStart(5, '0'), kb = b.d + ' ' + b.t.padStart(5, '0'); return ka < kb ? 1 : (ka > kb ? -1 : 0); });
}
function dayGroups(rows, idPrefix) {
  var groups = {}, order = [];
  sortRows(rows).forEach(function (t) { if (!groups[t.d]) { groups[t.d] = []; order.push(t.d); } groups[t.d].push(t); });
  return order.map(function (d) {
    var dt = new Date(d + 'T00:00:00'), si = 0, so = 0;
    groups[d].forEach(function (t) { if (counted(t)) { si += amt(t.inc); so += amt(t.out); } });
    var right = (si ? '<span class="gi">收</span> <span class="s">' + money(si) + '</span>' : '') + (si && so ? '　' : '') + (so ? '<span class="ro">支</span> <span class="s">' + money(so) + '</span>' : '');
    return '<div class="dgrp"' + (idPrefix ? ' id="' + idPrefix + d + '"' : '') + '><div class="dgh"><span>' + (dt.getMonth() + 1) + '月' + dt.getDate() + '日 週' + WK[dt.getDay()] + '</span><span>' + right + '</span></div>' +
      groups[d].map(function (t) {
        var isOut = t.out !== '' && t.out != null, v = isOut ? t.out : t.inc, c = counted(t);
        var nv = amt(v), a = (isOut ? '-' : '+') + curSym(t.cur) + fmt(nv, (t.cur === 'USD' || nv % 1) ? 2 : 0);
        return '<div class="trow">' + icon(t.cat) + '<div class="l"><div class="c">' + esc(t.cat || '未分類') + '</div><div class="n">' + esc(t.note || '') + '</div></div>' +
          '<div class="r"><div class="a ' + (!c ? 'x' : isOut ? 'ro' : 'gi') + '">' + a + '</div><div class="m">' + esc(t.acc) + '・' + esc(t.t) + '</div></div></div>';
      }).join('') + '</div>';
  }).join('');
}

function renderTx() {
  if (!TXM) renderTxOptions();
  var acc = $('txAcc').value, y = TXM.getFullYear(), m = TXM.getMonth();
  $('accLbl').textContent = acc || '全部帳戶';
  $('txTitle').textContent = y + ' ' + CN[m] + '月';
  $('vRec').style.display = VIEW === 'rec' ? 'block' : 'none';
  $('vRep').style.display = VIEW === 'rep' ? 'block' : 'none';
  if (VIEW === 'rep') return renderReport();

  // 每日收支（含前後月的頭尾幾天）
  var daily = {};
  D.tx.forEach(function (t) {
    if (acc && t.acc !== acc) return;
    if (!counted(t)) return;
    var o = daily[t.d] || (daily[t.d] = { i: 0, o: 0 });
    o.i += amt(t.inc); o.o += amt(t.out);
  });
  var first = new Date(y, m, 1), start = new Date(y, m, 1 - first.getDay());
  var last = new Date(y, m + 1, 0), cells = Math.ceil((first.getDay() + last.getDate()) / 7) * 7;
  var today = ymd(new Date());
  var html = ['日','一','二','三','四','五','六'].map(function (w) { return '<div class="wh">週' + w + '</div>'; }).join('');
  for (var k = 0; k < cells; k++) {
    var d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + k), key = ymd(d), x = daily[key];
    var c = 'dc' + (d.getMonth() !== m ? ' other' : '') + (key === today ? ' today' : '');
    html += '<div class="' + c + '" data-d="' + key + '"><b>' + d.getDate() + '</b>' +
      (x && x.i ? '<div class="gi">' + short(x.i) + '</div>' : '') + (x && x.o ? '<div class="ro">' + short(x.o) + '</div>' : '') + '</div>';
  }
  $('lcal').innerHTML = html;

  var rows = monthRows(acc), si = 0, so = 0;
  rows.forEach(function (t) { if (counted(t)) { si += amt(t.inc); so += amt(t.out); } });
  $('ltot').innerHTML = '<div><div class="muted">收入</div><div class="v gi">' + money(si) + '</div></div>' +
    '<div><div class="muted">支出</div><div class="v ro">' + money(so) + '</div></div>' +
    '<div><div class="muted">結餘</div><div class="v">' + (si - so < 0 ? '-' : '') + money(Math.abs(si - so)) + '</div></div>';
  $('dayList').innerHTML = dayGroups(rows, 'day-') || '<div class="card muted" style="text-align:center">這個月沒有紀錄</div>';
}

function jumpDay(key) {
  var d = new Date(key + 'T00:00:00');
  if (d.getMonth() !== TXM.getMonth() || d.getFullYear() !== TXM.getFullYear()) { TXM = new Date(d.getFullYear(), d.getMonth(), 1); renderTx(); }
  var el = $('day-' + key);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); else toast((d.getMonth() + 1) + '/' + d.getDate() + ' 沒有紀錄');
}

/* ---------- 報表 ---------- */
function catTotals(kind) {
  var acc = $('txAcc').value, by = {}, total = 0;
  monthRows(acc).forEach(function (t) {
    if (!counted(t)) return;
    var v = amt(kind === 'out' ? t.out : t.inc); if (!v) return;
    var o = by[t.cat || '未分類'] || (by[t.cat || '未分類'] = { v: 0, n: 0 });
    o.v += v; o.n++; total += v;
  });
  var list = Object.keys(by).map(function (k) { return { c: k, v: by[k].v, n: by[k].n }; }).sort(function (a, b) { return b.v - a.v; });
  return { list: list, total: total };
}
function renderReport() {
  var out = catTotals('out'), inc = catTotals('in'), cur = RKIND === 'out' ? out : inc;
  // 甜甜圈圖
  var R = 70, r = 44, cx = 90, cy = 90, a0 = -Math.PI / 2, svg = '';
  if (cur.total > 0) {
    cur.list.forEach(function (x) {
      var f = x.v / cur.total, a1 = a0 + f * Math.PI * 2;
      if (f >= 0.9999) { svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + ((R + r) / 2) + '" fill="none" stroke="' + ccolor(x.c) + '" stroke-width="' + (R - r) + '"/>'; }
      else {
        var lg = a1 - a0 > Math.PI ? 1 : 0, p = function (rad, a) { return (cx + rad * Math.cos(a)).toFixed(2) + ' ' + (cy + rad * Math.sin(a)).toFixed(2); };
        svg += '<path d="M' + p(R, a0) + ' A' + R + ' ' + R + ' 0 ' + lg + ' 1 ' + p(R, a1) + ' L' + p(r, a1) + ' A' + r + ' ' + r + ' 0 ' + lg + ' 0 ' + p(r, a0) + 'Z" fill="' + ccolor(x.c) + '" stroke="var(--card)" stroke-width="1.5"/>';
      }
      if (f >= 0.06) { var am = (a0 + a1) / 2, lr = (R + r) / 2; svg += '<text x="' + (cx + lr * Math.cos(am)).toFixed(1) + '" y="' + (cy + lr * Math.sin(am) + 4).toFixed(1) + '" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">' + Math.round(f * 100) + '%</text>'; }
      a0 = a1;
    });
  } else svg = '<circle cx="90" cy="90" r="57" fill="none" stroke="var(--card2)" stroke-width="26"/>';
  svg += '<text x="90" y="86" text-anchor="middle" font-size="12" fill="var(--muted)">' + (RKIND === 'out' ? '支出' : '收入') + '</text><text x="90" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="var(--text)">' + short(cur.total) + '</text>';
  $('donut').innerHTML = '<svg width="180" height="180" viewBox="0 0 180 180">' + svg + '</svg>';
  $('kseg').innerHTML = '<button class="' + (RKIND === 'out' ? 'on' : '') + '" onclick="RKIND=\'out\';renderReport()"><div class="t">支出</div><div class="v ro">' + money(out.total) + '</div></button>' +
    '<button class="in ' + (RKIND === 'in' ? 'on' : '') + '" onclick="RKIND=\'in\';renderReport()"><div class="t">收入</div><div class="v gi">' + money(inc.total) + '</div></button>';
  $('catStat').innerHTML = cur.list.map(function (x) {
    var f = cur.total ? x.v / cur.total : 0;
    return '<div class="crow" data-c="' + esc(x.c) + '">' + icon(x.c) + '<div class="l"><div class="top"><span class="nm">' + esc(x.c) + '<span class="pc">' + (f * 100).toFixed(2) + '%</span></span><span class="amt">' + money(x.v) + '</span></div>' +
      '<div class="bt"><div class="bar2"><i style="width:' + (f * 100).toFixed(1) + '%;background:' + ccolor(x.c) + '"></i></div><span class="cnt">' + x.n + ' 筆</span></div></div><span class="chev">›</span></div>';
  }).join('') || '<div class="muted" style="text-align:center;padding:16px 0">這個月沒有' + (RKIND === 'out' ? '支出' : '收入') + '</div>';
}

/* ---------- 類別明細（全螢幕） ---------- */
function openSheet(cat) { if ($('sheet').style.display !== 'block') lockScroll(); SHEETCAT = cat; $('sheet').style.display = 'block'; $('sheet').scrollTop = 0; renderSheet(); }
function closeSheet() { if ($('sheet').style.display === 'block') unlockScroll(); SHEETCAT = null; $('sheet').style.display = 'none'; }
function renderSheet() {
  var y = TXM.getFullYear(), m = TXM.getMonth(), last = new Date(y, m + 1, 0).getDate(), mm = String(m + 1).padStart(2, '0');
  $('shTitle').textContent = mm + '.1~' + mm + '.' + last;
  var acc = $('txAcc').value, isOut = RKIND === 'out', tot = 0;
  var rows = monthRows(acc).filter(function (t) { return counted(t) && (t.cat || '未分類') === SHEETCAT && amt(isOut ? t.out : t.inc) > 0; });
  rows.forEach(function (t) { tot += amt(isOut ? t.out : t.inc); });
  $('shTot').innerHTML = '<div class="t">' + icon(SHEETCAT) + esc(SHEETCAT) + ' 總計</div><div class="v"><span class="' + (isOut ? 'ro' : 'gi') + '">' + (isOut ? '支' : '收') + '</span> ' + money(tot) + '</div>';
  $('shList').innerHTML = dayGroups(rows, '') || '<div class="card muted" style="text-align:center">這個月沒有紀錄</div>';
}

/* ---------- 記一筆 ---------- */
function renderForm() {
  var cur = $('fAcc').value;
  $('fAcc').innerHTML = D.accounts.map(function (a) { return '<option>' + esc(a.name) + '</option>'; }).join('');
  if (cur) $('fAcc').value = cur;
  var cnt = {}, notes = {};
  D.tx.forEach(function (t) {
    if (!t.cat || t.cat === '轉帳' || t.cat === '卡費') return;
    cnt[t.cat] = (cnt[t.cat] || 0) + 1;
    if (t.note) (notes[t.cat] = notes[t.cat] || {})[t.note] = 1;
  });
  NOTES = notes;
  var cats = Object.keys(cnt).sort(function (a, b) { return cnt[b] - cnt[a]; });
  $('catList').innerHTML = cats.map(function (s) { return '<option value="' + esc(s) + '">'; }).join('');
  $('catChips').innerHTML = cats.slice(0, 10).map(function (s) { return '<button type="button" data-c="' + esc(s) + '">' + esc(s) + '</button>'; }).join('');
  syncCat();
}
var NOTES = {};
function syncCat() {
  var c = $('fCat').value.trim(), btns = $('catChips').querySelectorAll('button');
  for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('on', btns[i].getAttribute('data-c') === c);
  $('noteList').innerHTML = Object.keys(NOTES[c] || {}).slice(0, 60).map(function (s) { return '<option value="' + esc(s) + '">'; }).join('');
}
function setKind(k) { kind = k; $('kOut').classList.toggle('on', k === '支出'); $('kIn').classList.toggle('on', k === '收入'); }
function addEntry() {
  var amt = parseFloat($('fAmt').value), acc = $('fAcc').value, cat = $('fCat').value.trim(), note = $('fNote').value.trim();
  if (!(amt > 0)) { toast('請輸入金額'); return; }
  if (!cat) { toast('請選分類'); return; }
  $('fBtn').disabled = true;
  api({ action: 'quick', token: TK, account: acc, amount: amt, kind: kind, cat: cat, note: note }, true).then(function (r) {
    toast('已記錄，' + acc + ' 結餘 ' + fmt(r.balance, 2));
    $('fAmt').value = ''; $('fNote').value = '';
    return load();
  }).catch(function (e) { toast(e && e.message ? e.message : '記錄失敗'); })
    .then(function () { $('fBtn').disabled = false; });
}

/* ---------- 啟動 ---------- */
TK = stored('tk');
if (TK) load(); else showLogin();
$('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
$('cal').addEventListener('click', function (e) { var c = e.target.closest('[data-d]'); if (c) openDay(c.getAttribute('data-d')); });
$('lcal').addEventListener('click', function (e) { var c = e.target.closest('.dc'); if (c) jumpDay(c.getAttribute('data-d')); });
$('catStat').addEventListener('click', function (e) { var c = e.target.closest('.crow'); if (c) openSheet(c.getAttribute('data-c')); });
$('fCat').addEventListener('input', syncCat);
$('catChips').addEventListener('click', function (e) { var c = e.target.getAttribute('data-c'); if (c) { $('fCat').value = c; syncCat(); } });
</script>
</body>
</html>
